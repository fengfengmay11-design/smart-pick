<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智选 · AI 电子产品决策助手</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-light: #eef2ff;
    --primary-dark: #3730a3;
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
    --bg: #f8fafc;
    --card-bg: #fff;
    --card-hover: #fff;
    --text: #0f172a;
    --text-secondary: #64748b;
    --text-hint: #94a3b8;
    --border: #e2e8f0;
    --border-light: #f1f5f9;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.03);
    --shadow-xl: 0 8px 24px rgba(0,0,0,.08);
    --radius: 14px;
    --radius-sm: 10px;
    --nav-height: 52px;
    --bar-height: 68px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #f1f5f9; color: var(--text); font-size: 14px; line-height: 1.5;
    display: flex; justify-content: center; min-height: 100vh;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  #app {
    width: 100%; max-width: 430px; background: var(--bg); min-height: 100vh;
    position: relative; overflow-x: hidden; padding-bottom: var(--bar-height);
  }

  /* 导航 */
  .nav {
    position: sticky; top:0; z-index:100;
    background: rgba(255,255,255,.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    height: var(--nav-height); display:flex; align-items:center; padding:0 16px;
    border-bottom:1px solid var(--border-light);
  }
  .nav-title { font-size:17px; font-weight:700; flex:1; text-align:center; color:var(--text); letter-spacing:-0.01em; }
  .nav-back { font-size:22px; width:32px; cursor:pointer; color:var(--primary); display:none; }
  .nav-back.visible { display:block; }

  /* 页面 */
  .page { display:none; padding:16px 16px 0; }
  .page.active { display:block; }

  /* 品类 Tab */
  .cat-tabs { display:flex; gap:6px; padding:4px 0 14px; flex-wrap:wrap; }
  .cat-tab {
    padding:8px 16px; border-radius:22px; font-size:13px; font-weight:600;
    cursor:pointer; background:var(--card-bg); color:var(--text-secondary);
    border:1.5px solid var(--border); white-space:nowrap;
    transition:all .2s; box-shadow: var(--shadow-sm);
  }
  .cat-tab:hover { border-color: var(--primary); color: var(--primary); }
  .cat-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 2px 8px rgba(79,70,229,.3); }

  /* 搜索 */
  .search-box {
    background:var(--card-bg); border-radius:var(--radius); padding:0 14px; margin-bottom:18px;
    display:flex; align-items:center; gap:8px; box-shadow:var(--shadow);
    border:1.5px solid transparent; transition:border .2s;
  }
  .search-box:focus-within { border-color:var(--primary); box-shadow:var(--shadow-lg),0 0 0 3px rgba(79,70,229,.1); }
  .search-box input {
    flex:1; border:none; outline:none; height:44px; font-size:15px; background:transparent;
    color:var(--text);
  }
  .search-box input::placeholder { color:var(--text-hint); }
  .search-box .s-icon { font-size:18px; color:var(--text-hint); }

  .section-title {
    font-size:14px; font-weight:700; margin:18px 0 10px; color:var(--text);
    display:flex; align-items:center; gap:6px; letter-spacing:-0.01em;
  }

  /* 价格区间卡片 */
  .price-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:10px; }
  .price-card {
    background:var(--card-bg); border-radius:var(--radius-sm); padding:14px 15px;
    display:flex; align-items:center; gap:11px; text-align:left;
    cursor:pointer; box-shadow:var(--shadow); transition:transform .18s, box-shadow .18s, border-color .18s;
    position:relative; overflow:hidden; border:1px solid var(--border-light);
  }
  .price-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--primary); }
  .price-card:active { transform:scale(.985); }
  .price-card .pc-icon {
    width:34px; height:34px; flex-shrink:0; border-radius:10px;
    background:rgba(79,70,229,.08); color:var(--primary);
    display:flex; align-items:center; justify-content:center;
    transition:background .18s;
  }
  .price-card .pc-icon svg { width:18px; height:18px; }
  .price-card:hover .pc-icon { background:rgba(79,70,229,.15); }
  .price-card .pc-body { flex:1; min-width:0; }
  .price-card .p-label { font-size:14.5px; font-weight:700; color:var(--text); letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .price-card .p-count { font-size:12px; color:var(--text-hint); margin-top:2px; }
  .price-card .p-count b { color:var(--primary); font-weight:700; }
  .price-card .pc-go { color:var(--border); font-size:18px; opacity:0; transform:translateX(-4px); transition:opacity .18s, transform .18s; flex-shrink:0; }
  .price-card:hover .pc-go { opacity:1; transform:translateX(0); color:var(--primary); }

  /* 品牌 */
  .brand-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; }
  .brand-row::-webkit-scrollbar { display:none; }
  .brand-chip {
    flex:0 0 auto; min-width:64px; background:var(--card-bg); border-radius:var(--radius-sm);
    padding:12px 14px; text-align:center; cursor:pointer; box-shadow:var(--shadow);
    font-weight:700; font-size:14px; white-space:nowrap; transition:all .2s;
    border:1.5px solid var(--border-light);
  }
  .brand-chip:hover { transform:translateY(-1px); box-shadow:var(--shadow-lg); }
  .brand-chip:active { transform:scale(.97); }
  .brand-chip .bc-count { display:block; font-size:10px; font-weight:400; opacity:.5; margin-top:2px; }
  .brand-chip.apple { color:#1d1d1f; }
  .brand-chip.huawei { color:#cf0a2c; }
  .brand-chip.xiaomi { color:#ff6900; }
  .brand-chip.vivo { color:#415fff; }
  .brand-chip.oppo { color:#1ba784; }
  .brand-chip.荣耀 { color:#0b8ed0; }
  .brand-chip.三星 { color:#1428a0; }
  .brand-chip.nvidia { color:#76b900; }
  .brand-chip.amd { color:#ed1c24; }
  .brand-chip.intel { color:#0071c5; }
  .brand-chip.格力 { color:#00a0e9; }
  .brand-chip.美的 { color:#0066cc; }
  .brand-chip.海尔 { color:#009ad6; }
  .brand-chip.石头 { color:#222; }
  .brand-chip.追觅 { color:#e60012; }
  .brand-chip.科沃斯 { color:#005bac; }
  .brand-chip.云鲸 { color:#00b4d8; }
  .brand-chip.联想 { color:#e2231a; }
  .brand-chip.华硕 { color:#00b3e3; }
  .brand-chip.戴尔 { color:#007db8; }
  .brand-chip.索尼 { color:#000; }
  .brand-chip.bose { color:#111; }
  .brand-chip.lg { color:#a50034; }
  .brand-chip.aoc { color:#e2231a; }

  /* 热门列表 */
  .hot-list { display:flex; flex-direction:column; gap:10px; }
  .hot-item {
    background:var(--card-bg); border-radius:var(--radius); padding:14px; display:flex;
    align-items:center; gap:12px; cursor:pointer; box-shadow:var(--shadow);
    transition:all .2s; border:1.5px solid var(--border-light);
  }
  .hot-item:hover { transform:translateY(-1px); box-shadow:var(--shadow-lg); }
  .hot-item .h-img {
    width:52px; height:52px; border-radius:12px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .hot-item .h-info { flex:1; min-width:0; }
  .hot-item .h-name { font-weight:700; font-size:14px; letter-spacing:-0.01em; }
  .hot-item .h-price { color:var(--danger); font-weight:800; font-size:16px; }
  .hot-item .h-source { font-size:11px; color:var(--text-hint); }
  .hot-item .h-tag {
    display:inline-block; font-size:10px; padding:2px 8px; border-radius:4px;
    background:var(--primary-light); color:var(--primary); font-weight:600; margin-top:3px;
  }
  .hot-item .h-add {
    width:32px; height:32px; border-radius:50%;
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0; cursor:pointer; transition:all .2s;
  }
  .hot-item .h-add:hover { transform:scale(1.1); }
  .hot-item .h-add.added { background:var(--success); }
  .hot-item .h-add.full { background:#cbd5e1; cursor:not-allowed; pointer-events:none; }

  /* 机型列表 */
  .filter-bar { display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .filter-bar::-webkit-scrollbar { display:none; }
  .filter-chip {
    padding:7px 16px; border-radius:20px; font-size:13px; font-weight:600;
    border:1.5px solid var(--border); background:var(--card-bg);
    white-space:nowrap; cursor:pointer; transition:all .2s;
  }
  .filter-chip:hover { border-color:var(--primary); }
  .filter-chip.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .sort-bar { display:flex; gap:6px; margin-bottom:14px; }
  .sort-chip {
    padding:5px 14px; border-radius:16px; font-size:12px; font-weight:500;
    border:1px solid var(--border); background:var(--card-bg); cursor:pointer;
    transition:all .2s;
  }
  .sort-chip:hover { border-color:var(--primary); }
  .sort-chip.active { background:var(--primary-light); color:var(--primary); border-color:var(--primary); font-weight:700; }
  .result-count { font-size:12px; color:var(--text-hint); margin-bottom:12px; font-weight:500; }

  .phone-list { display:flex; flex-direction:column; gap:10px; }
  .phone-card {
    background:var(--card-bg); border-radius:var(--radius); padding:16px; display:flex;
    gap:14px; box-shadow:var(--shadow); position:relative;
    border:1.5px solid var(--border-light); transition:all .2s;
  }
  .phone-card:hover { transform:translateY(-1px); box-shadow:var(--shadow-lg); }
  .phone-card .pc-img {
    width:68px; height:68px; border-radius:12px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;
  }
  .phone-card .pc-main { flex:1; min-width:0; }
  .phone-card .pc-brand { font-size:11px; color:var(--text-hint); font-weight:500; text-transform:uppercase; letter-spacing:0.05em; }
  .phone-card .pc-model { font-size:16px; font-weight:700; margin:1px 0; letter-spacing:-0.01em; }
  .phone-card .pc-storage { font-size:12px; color:var(--text-secondary); }
  .phone-card .pc-price-row { display:flex; align-items:baseline; gap:6px; margin-top:4px; }
  .phone-card .pc-price { font-size:20px; font-weight:800; color:var(--danger); }
  .phone-card .pc-source { font-size:11px; color:var(--text-hint); }
  .phone-card .pc-tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .phone-card .pc-tag { font-size:10px; padding:3px 8px; border-radius:6px; background:var(--primary-light); color:var(--primary); font-weight:600; }
  .phone-card .pc-specs { font-size:11px; color:var(--text-secondary); margin-top:4px; }
  .phone-card .pc-add {
    position:absolute; right:16px; bottom:16px; width:34px; height:34px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; border:none; transition:all .2s;
  }
  .phone-card .pc-add.add-btn { background:var(--primary); color:#fff; }
  .phone-card .pc-add.add-btn:hover { transform:scale(1.1); }
  .phone-card .pc-add.added-btn { background:var(--success); color:#fff; }
  .phone-card .pc-add.full-btn { background:#cbd5e1; color:#fff; cursor:not-allowed; }

  /* 对比栏 */
  .compare-bar {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:430px;
    background:rgba(255,255,255,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--border-light); padding:10px 16px;
    display:flex; align-items:center; gap:10px;
    z-index:200; box-shadow:0 -4px 20px rgba(0,0,0,.06);
  }
  .compare-bar .cb-phones { flex:1; display:flex; gap:8px; min-width:0; overflow-x:auto; }
  .compare-bar .cb-slot {
    width:64px; height:56px; border-radius:12px; border:2px dashed var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:10px; color:var(--text-hint); flex-shrink:0; background:var(--bg);
    padding:3px; gap:2px; transition:all .2s;
  }
  .compare-bar .cb-slot.filled {
    border:2px solid var(--primary); background:var(--primary-light);
    color:var(--primary); font-weight:700; position:relative;
  }
  .compare-bar .cb-slot .cb-img { width:30px; height:30px; display:flex; align-items:center; justify-content:center; }
  .compare-bar .cb-slot .cb-img img, .compare-bar .cb-slot .cb-img svg { width:100%; height:100%; object-fit:contain; }
  .compare-bar .cb-slot .cb-name { font-size:9px; line-height:1.1; max-width:58px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .compare-bar .cb-slot .cb-remove {
    position:absolute; top:-7px; right:-7px; width:18px; height:18px;
    border-radius:50%; background:var(--danger); color:#fff; font-size:10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    line-height:1; box-shadow:0 2px 4px rgba(239,68,68,.3);
  }
  .compare-bar .cb-btn {
    padding:10px 18px; border-radius:22px; font-size:13px; font-weight:700;
    border:none; cursor:pointer; white-space:nowrap; transition:all .2s;
  }
  .compare-bar .cb-btn.disabled { background:var(--bg); color:var(--text-hint); cursor:not-allowed; }
  .compare-bar .cb-btn.enabled {
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));
    color:#fff; box-shadow:0 2px 8px rgba(79,70,229,.3);
  }
  .compare-bar .cb-btn.enabled:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(79,70,229,.35); }
  .compare-bar .cb-btn.enabled:active { opacity:.85; }

  /* 筛选弹窗 */
  .filter-modal {
    position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15,23,42,.5);
    z-index:300; display:none; align-items:flex-end;
  }
  .filter-modal.show { display:flex; }
  .filter-modal .fm-content {
    background:var(--card-bg); border-radius:20px 20px 0 0; width:100%; max-width:430px;
    margin:0 auto; max-height:70vh; overflow-y:auto; padding:24px 18px;
  }
  .filter-modal .fm-header { font-size:16px; font-weight:700; margin-bottom:20px; display:flex; justify-content:space-between; }
  .filter-modal .fm-close { cursor:pointer; color:var(--text-hint); font-size:20px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:background .2s; }
  .filter-modal .fm-close:hover { background:var(--bg); }
  .filter-modal .fm-group { margin-bottom:18px; }
  .filter-modal .fm-label { font-size:12px; color:var(--text-secondary); margin-bottom:8px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; }
  .filter-modal .fm-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .filter-modal .fm-chip {
    padding:7px 18px; border-radius:20px; font-size:13px; font-weight:600;
    border:1.5px solid var(--border); background:var(--card-bg); cursor:pointer;
    transition:all .2s;
  }
  .filter-modal .fm-chip:hover { border-color:var(--primary); color:var(--primary); }
  .filter-modal .fm-chip.selected { background:var(--primary); color:#fff; border-color:var(--primary); }
  .filter-modal .fm-actions { display:flex; gap:10px; margin-top:24px; }
  .filter-modal .fm-actions button {
    flex:1; padding:12px; border-radius:24px; font-size:15px; font-weight:700; border:none; cursor:pointer; transition:all .2s;
  }
  .filter-modal .fm-reset { background:var(--bg); color:var(--text); }
  .filter-modal .fm-reset:hover { opacity:.8; }
  .filter-modal .fm-confirm { background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#fff; }

  /* 容量版本弹窗 */
  .storage-modal {
    position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15,23,42,.5);
    z-index:300; display:none; align-items:center; justify-content:center;
  }
  .storage-modal.show { display:flex; }
  .storage-modal .sm-content {
    background:var(--card-bg); border-radius:var(--radius); width:calc(100% - 48px); max-width:372px;
    padding:24px;
  }
  .storage-modal .sm-header { font-size:16px; font-weight:700; margin-bottom:18px; }
  .storage-modal .sm-option {
    padding:14px; border-radius:10px; border:1.5px solid var(--border); margin-bottom:8px;
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    transition:all .2s;
  }
  .storage-modal .sm-option:hover { border-color:var(--primary); }
  .storage-modal .sm-option.selected { border-color:var(--primary); background:var(--primary-light); }
  .storage-modal .sm-option .sm-storage { font-weight:700; }
  .storage-modal .sm-option .sm-price { color:var(--danger); font-weight:700; font-size:16px; }
  .storage-modal .sm-close {
    display:block; width:100%; padding:12px; margin-top:12px; border-radius:24px;
    border:none; background:var(--bg); font-size:14px; font-weight:600; cursor:pointer; transition:all .2s;
  }
  .storage-modal .sm-close:hover { opacity:.8; }

  /* 详情弹窗 */
  .detail-modal {
    position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15,23,42,.5);
    z-index:350; display:none; align-items:flex-end;
  }
  .detail-modal.show { display:flex; }
  .detail-modal .dm-content {
    background:var(--card-bg); border-radius:20px 20px 0 0; width:100%; max-width:430px;
    margin:0 auto; max-height:88vh; overflow-y:auto; padding:0;
  }
  .dm-header {
    background:linear-gradient(135deg, var(--primary-light), #fff);
    padding:24px 16px 18px; text-align:center; position:sticky; top:0; z-index:2;
    border-radius:20px 20px 0 0;
  }
  .dm-close-x {
    position:absolute; right:12px; top:12px; width:32px; height:32px;
    border-radius:50%; background:rgba(255,255,255,.95); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    color:var(--text-secondary); transition:all .2s; box-shadow:var(--shadow);
  }
  .dm-close-x:hover { background:#fff; color:var(--text); }
  .dm-img {
    width:68px; height:68px; border-radius:16px; background:#fff;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 12px; box-shadow:var(--shadow); overflow:hidden;
  }
  .dm-brand { font-size:11px; color:var(--text-hint); font-weight:500; text-transform:uppercase; letter-spacing:0.05em; }
  .dm-model { font-size:21px; font-weight:800; margin:2px 0; letter-spacing:-0.01em; }
  .dm-colors { font-size:12px; color:var(--text-secondary); margin-top:2px; }
  .dm-price-row { display:flex; align-items:baseline; justify-content:center; gap:8px; margin-top:10px; }
  .dm-price { font-size:26px; font-weight:800; color:var(--danger); }
  .dm-source { font-size:12px; color:var(--text-hint); }
  .dm-tags { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:8px; }
  .dm-tag { font-size:10px; padding:3px 10px; border-radius:6px; background:#fff; color:var(--text-secondary); border:1px solid var(--border); font-weight:600; }
  .dm-body { padding:0 16px 20px; }
  .dm-section { margin-top:16px; }
  .dm-section h4 { font-size:13px; font-weight:700; color:var(--text); margin-bottom:10px; padding-left:10px; border-left:3px solid var(--primary); }
  .dm-grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .dm-row { background:var(--bg); border-radius:10px; padding:10px 12px; font-size:12px; }
  .dm-row .dm-k { color:var(--text-hint); font-size:10px; margin-bottom:2px; font-weight:500; }
  .dm-row .dm-v { color:var(--text); font-weight:700; word-break:break-all; }
  .dm-row .dm-v.support { color:var(--success); }
  .dm-row .dm-v.miss { color:var(--danger); }
  .dm-actions {
    position:sticky; bottom:0; background:rgba(255,255,255,.9); backdrop-filter:blur(10px);
    padding:14px 16px; border-top:1px solid var(--border); display:flex; gap:10px;
  }
  .dm-btn {
    flex:1; padding:13px; border-radius:26px; font-size:15px; font-weight:700;
    border:none; cursor:pointer; transition:all .2s;
  }
  .dm-btn-primary { background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#fff; }
  .dm-btn-primary:hover { opacity:.9; transform:translateY(-1px); }
  .dm-btn-secondary { background:var(--bg); color:var(--text); }
  .dm-btn-secondary:hover { opacity:.8; }
  .dm-btn-primary:disabled { background:#cbd5e1; cursor:not-allowed; transform:none; }
  .dm-storage-list { display:flex; flex-direction:column; gap:6px; }
  .dm-storage-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; background:var(--bg); border-radius:8px; font-size:13px;
  }
  .dm-storage-row .dm-st-name { font-weight:700; }
  .dm-storage-row .dm-st-prices { display:flex; gap:10px; font-size:12px; }
  .dm-storage-row .dm-st-jd { color:#e1251b; font-weight:700; }
  .dm-storage-row .dm-st-pdd { color:#e02e2e; font-weight:700; }
  .dm-link { display:block; text-align:center; padding:10px; margin-top:8px; font-size:12px; color:var(--primary); text-decoration:none; font-weight:600; }

  /* 对比结果页 */
  .compare-page { padding:12px; }
  .compare-summary { display:flex; gap:10px; overflow-x:auto; padding-bottom:8px; margin-bottom:18px; }
  .compare-summary::-webkit-scrollbar { display:none; }
  .cs-card {
    min-width:calc(50% - 5px); max-width:calc(50% - 5px); background:var(--card-bg);
    border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); position:relative;
    border:1.5px solid var(--border-light); transition:all .2s;
  }
  .cs-card:hover { transform:translateY(-1px); box-shadow:var(--shadow-lg); }
  .cs-card .cs-actions { display:flex; gap:6px; margin-bottom:10px; }
  .cs-card .cs-act-btn {
    font-size:10px; padding:4px 12px; border-radius:12px; border:1.5px solid var(--border);
    background:var(--card-bg); cursor:pointer; color:var(--text-secondary);
    font-weight:600; transition:all .2s;
  }
  .cs-card .cs-act-btn:hover { border-color:var(--primary); color:var(--primary); }
  .cs-card .cs-act-btn.remove { color:var(--danger); border-color:var(--danger); }
  .cs-card .cs-img {
    width:52px; height:52px; border-radius:10px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; margin-bottom:10px; overflow:hidden;
  }
  .cs-card .cs-model { font-size:14px; font-weight:700; letter-spacing:-0.01em; }
  .cs-card .cs-storage { font-size:11px; color:var(--text-secondary); }
  .cs-card .cs-price { font-size:22px; font-weight:800; color:var(--danger); margin-top:6px; }
  .cs-card .cs-source { font-size:10px; color:var(--text-hint); }

  /* 核心结论 */
  .conclusion {
    background:var(--card-bg); border-radius:var(--radius); padding:18px; margin-bottom:16px;
    box-shadow:var(--shadow); border:1.5px solid var(--border-light);
  }
  .conclusion h3 { font-size:16px; font-weight:700; margin-bottom:14px; color:var(--text); letter-spacing:-0.01em; }
  .conclusion .cl-diff { font-size:13px; color:var(--text-secondary); margin-bottom:12px; line-height:1.8; }
  .conclusion .cl-item {
    padding:12px 14px; border-radius:10px; margin-bottom:8px; font-size:13px; line-height:1.6;
  }
  .conclusion .cl-item.suitable { background:#f0fdf4; border:1px solid #86efac; }
  .conclusion .cl-item.unsuitable { background:#fef2f2; border:1px solid #fca5a5; }
  .conclusion .cl-item .cl-label { font-size:10px; font-weight:700; margin-bottom:3px; display:inline-block; padding:2px 10px; border-radius:4px; }
  .conclusion .cl-item.suitable .cl-label { background:var(--success); color:#fff; }
  .conclusion .cl-item.unsuitable .cl-label { background:var(--danger); color:#fff; }
  .conclusion .cl-model-name { font-weight:700; }

  /* 对比维度 */
  .dim-section {
    background:var(--card-bg); border-radius:var(--radius); padding:18px; margin-bottom:12px;
    box-shadow:var(--shadow); border:1.5px solid var(--border-light);
  }
  .dim-section h4 {
    font-size:15px; font-weight:700; margin-bottom:14px; padding-bottom:10px;
    border-bottom:1px solid var(--border-light); letter-spacing:-0.01em;
  }
  .dim-table { width:100%; border-collapse:collapse; font-size:13px; }
  .dim-table td { padding:9px 8px; border-bottom:1px solid var(--border-light); text-align:center; vertical-align:top; }
  .dim-table td.label { text-align:left; color:var(--text-secondary); font-size:11px; width:25%; font-weight:600; }
  .dim-table .highlight { color:var(--primary); font-weight:700; }
  .dim-table .highlight-low { color:var(--success); font-weight:700; }
  .dim-table .highlight-miss { color:var(--danger); }

  /* 横向滚动 */
  .scroll-hint { font-size:10px; color:var(--text-hint); margin-bottom:6px; text-align:center; }
  .scroll-container { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .scroll-container::-webkit-scrollbar { height:4px; }
  .scroll-container::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
  .scroll-container .dim-table { min-width:340px; }

  /* 帮我选按钮 */
  .help-btn {
    display:block; width:100%; padding:14px; border-radius:28px; border:none;
    background:linear-gradient(135deg, var(--primary), #6366f1);
    color:#fff; font-size:16px; font-weight:700; cursor:pointer;
    margin-top:6px; margin-bottom:24px; transition:all .2s;
    box-shadow:0 4px 14px rgba(79,70,229,.3);
  }
  .help-btn:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(79,70,229,.35); }
  .help-btn:active { opacity:.85; }

  /* 帮我选弹窗 */
  .help-modal {
    position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15,23,42,.5);
    z-index:300; display:none; align-items:flex-end;
  }
  .help-modal.show { display:flex; }
  .help-modal .hm-content {
    background:var(--card-bg); border-radius:20px 20px 0 0; width:100%; max-width:430px;
    margin:0 auto; max-height:80vh; overflow-y:auto; padding:24px 18px;
  }
  .help-modal .hm-title { font-size:20px; font-weight:800; margin-bottom:4px; letter-spacing:-0.02em; }
  .help-modal .hm-sub { font-size:13px; color:var(--text-hint); margin-bottom:24px; }
  .help-modal .hm-q { margin-bottom:22px; }
  .help-modal .hm-q-label { font-size:15px; font-weight:700; margin-bottom:10px; letter-spacing:-0.01em; }
  .help-modal .hm-options { display:flex; gap:8px; flex-wrap:wrap; }
  .help-modal .hm-opt {
    padding:9px 20px; border-radius:22px; border:1.5px solid var(--border);
    font-size:13px; cursor:pointer; background:var(--card-bg); transition:all .2s;
    font-weight:600; color:var(--text-secondary);
  }
  .help-modal .hm-opt:hover { border-color:var(--primary); color:var(--primary); }
  .help-modal .hm-opt.selected { background:var(--primary); color:#fff; border-color:var(--primary); }
  .help-modal .hm-submit {
    width:100%; padding:14px; border-radius:28px; border:none;
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));
    color:#fff; font-size:16px; font-weight:700; cursor:pointer;
    margin-top:12px; transition:all .2s; box-shadow:0 4px 14px rgba(79,70,229,.3);
  }
  .help-modal .hm-submit:hover { transform:translateY(-1px); }
  .help-modal .hm-submit:disabled { background:#cbd5e1; box-shadow:none; cursor:not-allowed; transform:none; }

  /* 推荐结果 */
  .help-result {
    background:linear-gradient(135deg, #eef2ff, #f0f5ff); border-radius:var(--radius);
    padding:18px; margin-top:18px; border:1.5px solid #c7d2fe; display:none;
  }
  .help-result.show { display:block; }
  .help-result .hr-title { font-size:17px; font-weight:800; color:var(--primary); margin-bottom:10px; }
  .help-result .hr-model { font-size:21px; font-weight:800; margin-bottom:14px; letter-spacing:-0.01em; }
  .help-result .hr-reasons { margin-bottom:12px; }
  .help-result .hr-reasons li { font-size:13px; margin-bottom:5px; margin-left:20px; color:var(--text-secondary); }
  .help-result .hr-tradeoff { font-size:12px; color:var(--warning); background:#fefce8; padding:10px 14px; border-radius:8px; margin-bottom:10px; font-weight:500; }
  .help-result .hr-others { font-size:12px; color:var(--text-hint); }

  /* 置信度 & AI 引擎标识 */
  .hr-conf-row { display:flex; align-items:center; gap:12px; margin:6px 0 14px; }
  .hr-conf-ring { position:relative; width:56px; height:56px; flex-shrink:0; }
  .hr-conf-ring svg { transform:rotate(-90deg); }
  .hr-conf-ring .hr-conf-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:var(--primary); }
  .hr-conf-meta { flex:1; }
  .hr-conf-meta .hr-conf-label { font-size:11px; color:var(--text-hint); font-weight:600; text-transform:uppercase; letter-spacing:0.04em; }
  .hr-conf-meta .hr-conf-verdict { font-size:13px; font-weight:700; color:var(--text); margin-top:2px; }
  .ai-badge { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; color:var(--primary); background:var(--primary-light); padding:3px 9px; border-radius:20px; letter-spacing:0.02em; }

  /* 候选评分条 */
  .hr-scorebar { margin:4px 0 8px; }
  .hr-scorebar .hr-sb-item { margin-bottom:8px; }
  .hr-scorebar .hr-sb-head { display:flex; justify-content:space-between; font-size:12px; font-weight:600; margin-bottom:3px; }
  .hr-scorebar .hr-sb-head .hr-sb-name { color:var(--text); }
  .hr-scorebar .hr-sb-head .hr-sb-val { color:var(--primary); font-weight:800; }
  .hr-scorebar .hr-sb-track { height:7px; background:#e0e7ff; border-radius:4px; overflow:hidden; }
  .hr-scorebar .hr-sb-fill { height:100%; background:linear-gradient(90deg, #6366f1, #4f46e5); border-radius:4px; transition:width .6s cubic-bezier(.4,0,.2,1); }
  .hr-scorebar .hr-sb-fill.second { background:linear-gradient(90deg, #a5b4fc, #818cf8); }

  /* AI 质量自评面板 */
  .qa-panel { margin-top:16px; background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .qa-panel .qa-title { font-size:13px; font-weight:800; color:var(--text); margin-bottom:3px; display:flex; align-items:center; gap:6px; }
  .qa-panel .qa-sub { font-size:11px; color:var(--text-hint); margin-bottom:14px; line-height:1.5; }
  .qa-metrics { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .qa-metric { background:var(--bg); border-radius:var(--radius-sm); padding:11px 12px; }
  .qa-metric .qa-m-label { font-size:10px; color:var(--text-hint); font-weight:600; margin-bottom:5px; display:flex; justify-content:space-between; }
  .qa-metric .qa-m-label b { color:var(--text); font-size:13px; font-weight:800; }
  .qa-metric .qa-m-track { height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
  .qa-metric .qa-m-fill { height:100%; border-radius:3px; }
  .qa-metric .qa-m-fill.g { background:var(--success); }
  .qa-metric .qa-m-fill.y { background:var(--warning); }
  .qa-metric .qa-m-fill.b { background:var(--primary); }
  .qa-note { margin-top:12px; font-size:11px; color:var(--text-secondary); line-height:1.6; background:var(--primary-light); border-radius:var(--radius-sm); padding:10px 12px; }
  .qa-note b { color:var(--primary-dark); }

  /* 空状态 */
  .empty-state { text-align:center; padding:50px 20px; color:var(--text-hint); }
  .empty-state .empty-icon { font-size:56px; margin-bottom:14px; }
  .empty-state .empty-text { font-size:14px; }

  /* Toast */
  .toast {
    position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); z-index:999;
    background:rgba(15,23,42,.85); color:#fff; padding:12px 28px; border-radius:24px;
    font-size:14px; pointer-events:none; opacity:0; transition:opacity .3s;
    font-weight:600; box-shadow:0 8px 32px rgba(0,0,0,.15);
  }
  .toast.show { opacity:1; }

  /* ===== AI 智能选购入口卡片 ===== */
  .ai-shop-card {
    background:linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    border-radius:var(--radius); padding:18px; margin-bottom:18px;
    box-shadow:0 8px 28px rgba(79,70,229,.28); position:relative; overflow:hidden;
  }
  .ai-shop-card::after { content:""; position:absolute; right:-30px; top:-30px; width:120px; height:120px; background:rgba(255,255,255,.08); border-radius:50%; }
  .ai-shop-card .asc-title { color:#fff; font-size:16px; font-weight:800; display:flex; align-items:center; gap:7px; margin-bottom:4px; letter-spacing:-0.01em; }
  .ai-shop-card .asc-title .asc-tag { font-size:10px; font-weight:700; background:rgba(255,255,255,.22); color:#fff; padding:2px 8px; border-radius:20px; }
  .ai-shop-card .asc-sub { color:rgba(255,255,255,.82); font-size:12px; margin-bottom:12px; }
  .ai-shop-card .asc-inputwrap { display:flex; gap:8px; position:relative; z-index:1; }
  .ai-shop-card .asc-input {
    flex:1; border:none; border-radius:var(--radius-sm); padding:12px 14px;
    font-size:14px; color:var(--text); background:#fff; outline:none;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  .ai-shop-card .asc-input::placeholder { color:var(--text-hint); }
  .ai-shop-card .asc-btn {
    border:none; border-radius:var(--radius-sm); padding:0 18px; font-size:14px; font-weight:700;
    color:var(--primary); background:#fff; cursor:pointer; white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.06); transition:transform .15s;
  }
  .ai-shop-card .asc-btn:hover { transform:translateY(-1px); }
  .ai-shop-card .asc-chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:11px; position:relative; z-index:1; }
  .ai-shop-card .asc-chip {
    font-size:11px; color:#fff; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25);
    padding:4px 11px; border-radius:20px; cursor:pointer; transition:background .15s;
  }
  .ai-shop-card .asc-chip:hover { background:rgba(255,255,255,.3); }

  /* ===== AI 选购弹窗 ===== */
  .ai-modal { position:fixed; inset:0; background:rgba(15,23,42,.5); backdrop-filter:blur(4px); z-index:200; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px; }
  .ai-modal.show { display:flex; }
  .ai-modal .am-content { background:var(--card-bg); border-radius:20px; width:100%; max-width:430px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.3); animation:amIn .3s cubic-bezier(.16,1,.3,1); }
  @keyframes amIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .am-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .am-head .am-title { font-size:19px; font-weight:800; letter-spacing:-0.02em; display:flex; align-items:center; gap:7px; }
  .am-head .am-close { font-size:22px; color:var(--text-hint); cursor:pointer; line-height:1; }
  .am-query { font-size:13px; color:var(--text-secondary); background:var(--bg); border-radius:var(--radius-sm); padding:10px 13px; margin:10px 0 4px; line-height:1.5; }
  .am-query b { color:var(--primary); }
  /* 意图解析标签 */
  .am-intent { margin:14px 0 6px; }
  .am-intent .am-intent-label { font-size:11px; color:var(--text-hint); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:7px; }
  .ai-engine-badge { display:inline-flex; align-items:center; font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; margin-left:6px; text-transform:none; letter-spacing:0; vertical-align:middle; }
  .ai-engine-badge.llm { color:#0f6e56; background:#e1f5ee; }
  .ai-engine-badge.local { color:#854f0b; background:#faeeda; }
  .am-intent .am-intent-tags { display:flex; gap:6px; flex-wrap:wrap; }
  .am-intent .am-itag { font-size:11px; font-weight:600; color:var(--primary-dark); background:var(--primary-light); border-radius:20px; padding:4px 11px; display:inline-flex; align-items:center; gap:4px; }
  .am-intent .am-itag.miss { color:var(--text-hint); background:var(--bg); }

  /* ===== 阶段三：AI 推荐增强内容样式 ===== */
  .ai-reason { margin:12px 0 8px; padding:12px 14px; background:linear-gradient(135deg,#f0f4ff,#eef6ff); border-left:3px solid var(--primary); border-radius:0 10px 10px 0; font-size:13px; line-height:1.75; color:var(--text-primary); }
  .ai-reason .ai-r-label { font-size:11px; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .ai-compare { margin:10px 0 6px; }
  .ai-compare .ai-c-label { font-size:12px; font-weight:700; color:var(--text-primary); margin-bottom:6px; display:flex; align-items:center; gap:5px; }
  .ai-compare .ai-c-item { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px; line-height:1.65; }
  .ai-compare .ai-c-item:last-child { border-bottom:none; }
  .ai-compare .ai-c-rank { width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;margin-top:2px; }
  .ai-compare .ai-c-rank.r1 { background:var(--primary); }
  .ai-compare .ai-c-rank.r2 { background:#6b7280; }
  .ai-compare .ai-c-rank.r3 { background:#9ca3af; }
  .ai-compare .ai-c-body { flex:1; }
  .ai-compare .ai-c-name { font-weight:700; color:var(--text-primary); }
  .ai-compare .ai-c-detail { color:var(--text-secondary); margin-top:1px; }
  .ai-advice { margin:10px 0 6px; padding:11px 13px; background:#fffbeb; border:1px solid #fde68a; border-radius:10px; }
  .ai-advice .ai-a-label { font-size:11px; font-weight:700; color:#92400e; text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; }
  .ai-advice .ai-a-list { font-size:12.5px; line-height:1.7; color:#78350f; }
  .ai-advice .ai-a-list li { margin-bottom:3px; padding-left:2px; }
  .ai-summary { margin:10px 0 4px; padding:10px 14px; background:var(--primary); color:#fff; border-radius:10px; font-size:13px; line-height:1.65; font-weight:600; }
  /* 追问区域 */
  .ai-followup { margin-top:14px; border-top:1px solid var(--border); padding-top:12px; }
  .ai-followup .ai-f-label { font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:7px; }
  .ai-followup .ai-f-inputwrap { display:flex; gap:6px; }
  .ai-followup .ai-f-input { flex:1; border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-size:13px; outline:none; transition:border-color .15s; }
  .ai-followup .ai-f-input:focus { border-color:var(--primary); }
  .ai-followup .ai-f-btn { border:none; background:var(--primary); color:#fff; font-weight:700; font-size:13px; padding:9px 16px; border-radius:10px; cursor:pointer; white-space:nowrap; transition:opacity .15s; }
  .ai-followup .ai-f-btn:hover { opacity:.85; }
  .ai-followup .ai-f-btn:disabled { opacity:.45; cursor:wait; }
  .ai-followup .ai-f-answer { margin-top:10px; padding:10px 13px; background:var(--bg); border-radius:10px; font-size:13px; line-height:1.7; color:var(--text-primary); display:none; }
  .ai-followup .ai-f-answer.show { display:block; animation:fadeInUp .25s ease; }
  @keyframes fadeInUp { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  /* LLM 加载态 */
  .ai-llm-loading { padding:16px;text-align:center;color:var(--text-hint);font-size:13px;line-height:1.8; }
  .ai-llm-loading .spinner { display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;vertical-align:-3px;margin-right:6px; }
  @keyframes spin { to{transform:rotate(360deg);} }

</style>
</head>

<div id="app"></div>
<div class="toast" id="toast"></div>

<!-- 筛选弹窗 -->
<div class="filter-modal" id="filterModal">
  <div class="fm-content">
    <div class="fm-header">
      <span>筛选条件</span>
      <span class="fm-close" id="fmClose">✕</span>
    </div>
    <div class="fm-group">
      <div class="fm-label">品牌</div>
      <div class="fm-chips" id="fBrandChips"></div>
    </div>
    <div class="fm-group">
      <div class="fm-label">价格区间</div>
      <div class="fm-chips" id="fPriceChips"></div>
    </div>
    <div id="fmDynamicSections"></div>
    <div class="fm-actions">
      <button class="fm-reset" id="fmReset">重置</button>
      <button class="fm-confirm" id="fmConfirm">确定</button>
    </div>
  </div>
</div>

<!-- 容量版本弹窗 -->
<div class="storage-modal" id="storageModal">
  <div class="sm-content" id="smContent"></div>
</div>

<!-- 手机详情弹窗 -->
<div class="detail-modal" id="detailModal">
  <div class="dm-content" id="dmContent"></div>
</div>

<!-- 帮我选弹窗 -->
<div class="help-modal" id="helpModal">
  <div class="hm-content" id="hmContent"></div>
</div>

<!-- AI 自然语言选购弹窗 -->
<div class="ai-modal" id="aiModal">
  <div class="am-content" id="amContent"></div>
</div>

<script src="phone-data.js"></script>

function cat() { return CATEGORIES[state.category] || CATEGORIES.phone; }
function d() { return cat().data(); }
// ==================== 状态管理 ====================
const state = {
  category: 'phone',
  page: 'home',
  compareList: [], // [{phoneId, storage}]
  filterBrand: null,
  filterPriceRange: null,
  filterScreenSize: null,
  filter5G: null,
  filterNFC: null,
  filterDualSim: null,
  sortBy: 'sales',
  searchQuery: '',
  filtersOpen: false
};

// ==================== 工具函数 ====================
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function getPhone(id) { return d().find(p => p.id === id); }

function getCompareEntry(idx) { return state.compareList[idx] || null; }

function getComparePhones() {
  const C = cat();
  return state.compareList.map(e => {
    const phone = getPhone(e.phoneId);
    if (!phone) return null;
    const priceSrc = C.getPriceSource(phone, e.storage);
    return { phone, storage: e.storage || 'default', priceSrc };
  }).filter(Boolean);
}

function isInCompare(phoneId) {
  return state.compareList.some(e => e.phoneId === phoneId);
}

// 全局刷新页面上所有 +/✓ 加入对比按钮的状态（列表页 pc-add + 首页热门 h-add）
// 不依赖当前页面类型，避免增删对比后按钮状态残留（如满3款移除后灰色按钮没变回可点）
function refreshCompareButtons() {
  document.querySelectorAll('.pc-add[data-phone], .h-add[data-phone]').forEach(btn => {
    const id = btn.dataset.phone;
    const inList = isInCompare(id);
    const full = !canAddCompare() && !inList;
    if (btn.classList.contains('pc-add')) {
      btn.className = 'pc-add ' + (inList ? 'added-btn' : (full ? 'full-btn' : 'add-btn'));
    } else {
      btn.className = 'h-add ' + (inList ? 'added' : (full ? 'full' : ''));
    }
    btn.textContent = inList ? '✓' : '+';
  });
}

function canAddCompare() { return state.compareList.length < 3; }

function canStartCompare() { return state.compareList.length >= 2; }

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 1800);
}

// ==================== 对比栏 ====================
function renderCompareBar() {
  const app = $('#app');
  let bar = $('#compareBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'compareBar';
    bar.className = 'compare-bar';
    bar.innerHTML = `
      <div class="cb-phones" id="cbPhones"></div>
      <button class="cb-btn disabled" id="cbBtn">再选2款开始对比</button>
    `;
    app.appendChild(bar);
    bar.querySelector('#cbBtn').addEventListener('click', onStartCompare);
  }
  const phonesEl = bar.querySelector('#cbPhones');
  const btn = bar.querySelector('#cbBtn');
  const slots = Array.from(phonesEl.children);

  // 更新槽位
  phonesEl.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const entry = getCompareEntry(i);
    const slot = document.createElement('div');
    slot.className = 'cb-slot' + (entry ? ' filled' : '');
    if (entry) {
      const p = getPhone(entry.phoneId);
      if (p) {
        const imgSlot = document.createElement('div');
        imgSlot.className = 'cb-img';
        imgSlot.innerHTML = phoneImage(p);
        slot.appendChild(imgSlot);
        const nameSlot = document.createElement('div');
        nameSlot.className = 'cb-name';
        nameSlot.textContent = p.model;
        slot.appendChild(nameSlot);
      } else {
        slot.textContent = '?';
      }
      const rm = document.createElement('span');
      rm.className = 'cb-remove';
      rm.textContent = '✕';
      rm.addEventListener('click', (e) => { e.stopPropagation(); removeFromCompare(i); });
      slot.appendChild(rm);
    } else {
      slot.textContent = i === 0 ? '+' : '';
    }
    phonesEl.appendChild(slot);
  }

  // 更新按钮
  const count = state.compareList.length;
  if (count === 0) {
    btn.textContent = '再选2款开始对比';
    btn.className = 'cb-btn disabled';
  } else if (count === 1) {
    btn.textContent = '再选1款开始对比';
    btn.className = 'cb-btn disabled';
  } else {
    btn.textContent = `开始对比（${count}款）`;
    btn.className = 'cb-btn enabled';
  }
}

function addToCompare(phoneId, storage) {
  if (!canAddCompare() && !isInCompare(phoneId)) {
    toast('最多同时对比3款产品');
    return;
  }
  if (isInCompare(phoneId)) {
    // 更新存储版本
    const idx = state.compareList.findIndex(e => e.phoneId === phoneId);
    state.compareList[idx].storage = storage || state.compareList[idx].storage;
    renderCompareBar();
    if (state.page === 'compare') renderComparePage();
    return;
  }
  state.compareList.push({ phoneId, storage: storage || (getPhone(phoneId).defaultStorage || 'default') });
  renderCompareBar();
  refreshCompareButtons();
  if (state.page === 'compare') renderComparePage();
}

function removeFromCompare(idx) {
  state.compareList.splice(idx, 1);
  renderCompareBar();
  refreshCompareButtons();
  if (state.page === 'compare') {
    if (state.compareList.length < 2) {
      state.page = state.filterBrand ? 'list' : 'home';
    }
    navigateTo(state.page);
  }
}

function onStartCompare() {
  if (!canStartCompare()) return;
  state.page = 'compare';
  navigateTo('compare');
}

// ==================== 导航 ====================
function navigateTo(page) {
  state.page = page;
  renderNav();
  renderPage();
  renderCompareBar();
  window.scrollTo(0, 0);
}

function renderNav() {
  let nav = $('#nav');
  if (!nav) {
    nav = document.createElement('div');
    nav.id = 'nav';
    nav.className = 'nav';
    nav.innerHTML = `
      <span class="nav-back" id="navBack">‹</span>
      <span class="nav-title" id="navTitle">智选</span>
    `;
    $('#app').insertBefore(nav, $('#app').firstChild);
    $('#navBack').addEventListener('click', onBack);
  }
  const back = $('#navBack');
  const title = $('#navTitle');
  if (state.page === 'home') {
    back.classList.remove('visible');
    title.textContent = '智选';
  } else if (state.page === 'list') {
    back.classList.add('visible');
    const label = state.filterPriceRange || state.filterBrand || '全部产品';
    title.textContent = label;
  } else if (state.page === 'compare') {
    back.classList.add('visible');
    title.textContent = '对比结果';
  }
}

function onBack() {
  if (state.page === 'compare') {
    state.page = (state.filterBrand || state.filterPriceRange) ? 'list' : 'home';
  } else if (state.page === 'list') {
    state.page = 'home';
    state.filterBrand = null;
    state.filterPriceRange = null;
  }
  navigateTo(state.page);
}

// ==================== 页面渲染 ====================
function renderPage() {
  const app = $('#app');
  // 清除旧页面
  const oldPages = app.querySelectorAll('.page');
  oldPages.forEach(p => p.remove());

  const page = document.createElement('div');
  page.className = 'page active';
  page.id = 'page-' + state.page;

  if (state.page === 'home') renderHome(page);
  else if (state.page === 'list') renderList(page);
  else if (state.page === 'compare') renderComparePageIn(page);

  app.appendChild(page);
}

// ==================== 首页 ====================
function renderHome(page) {
  const C = cat();
  page.innerHTML = `
    <div class="ai-shop-card">
      <div class="asc-title">✨ AI 智能选购 <span class="asc-tag">自然语言</span></div>
      <div class="asc-sub">用一句话描述需求，AI 自动识别品类，从全站 ${totalProductCount()} 款产品里挑出最合适的</div>
      <div class="asc-inputwrap">
        <input type="text" class="asc-input" id="aiShopInput" placeholder="${GLOBAL_AI_PLACEHOLDER}">
        <button class="asc-btn" id="aiShopBtn">找一找</button>
      </div>
      <div class="asc-chips" id="aiShopChips">
        ${GLOBAL_AI_EXAMPLES.map(e => `<span class="asc-chip" data-q="${escapeHtml(e)}">${escapeHtml(e)}</span>`).join('')}
      </div>
    </div>
    <div class="cat-tabs" id="catTabs">
      ${Object.keys(CATEGORIES).map(k => `<div class="cat-tab${state.category===k?' active':''}" data-cat="${k}">${CATEGORIES[k].icon} ${CATEGORIES[k].name}</div>`).join('')}
    </div>
    <div class="search-box">
      <span class="s-icon">🔍</span>
      <input type="text" placeholder="搜索品牌、系列、型号..." id="searchInput" value="${escapeHtml(state.searchQuery)}">
    </div>
    <div class="section-title">按预算选${C.name}</div>
    <div class="price-grid" id="priceGrid"></div>
    <div class="section-title">按品牌选${C.name}</div>
    <div class="brand-row" id="brandRow"></div>
    <div class="section-title">热门${C.name}</div>
    <div class="hot-list" id="hotList"></div>
  `;

  // 品类切换
  page.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', function() {
      const newCat = this.dataset.cat;
      if (newCat !== state.category) {
        state.category = newCat;
        state.filterBrand = null;
        state.filterPriceRange = null;
        state.sortBy = cat().defaultSort;
        state.compareList = [];
        state.searchQuery = '';
        navigateTo('home');
      }
    });
  });

  // AI 智能选购
  const aiInput = page.querySelector('#aiShopInput');
  const runAi = () => { const q = aiInput.value.trim(); if (q.length >= 2) openAiShop(q); else toast('多描述一点你的需求'); };
  page.querySelector('#aiShopBtn').addEventListener('click', runAi);
  aiInput.addEventListener('keydown', e => { if (e.key === 'Enter') runAi(); });
  page.querySelectorAll('.asc-chip').forEach(chip => {
    chip.addEventListener('click', function() { aiInput.value = this.dataset.q; openAiShop(this.dataset.q); });
  });

  // 搜索
  page.querySelector('#searchInput').addEventListener('input', function(e) {
    state.searchQuery = e.target.value;
    if (state.searchQuery.length >= 2) {
      state.filterBrand = null;
      state.filterPriceRange = null;
      navigateTo('list');
    }
  });
  page.querySelector('#searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && state.searchQuery.length >= 2) {
      state.filterBrand = null;
      state.filterPriceRange = null;
      navigateTo('list');
    }
  });

  // 价格区间
  const priceGrid = page.querySelector('#priceGrid');
  const data = d();
  C.priceRanges.forEach((range, idx) => {
    const count = data.filter(p => {
      const price = C.getPrice(p);
      return price >= range.min && price < range.max;
    }).length;
    // 统一的价签图标（克制、不误导）
    const card = document.createElement('div');
    card.className = 'price-card';
    card.innerHTML = `<div class="pc-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></div>`
      + `<div class="pc-body"><div class="p-label">${range.label}</div>`
      + `<div class="p-count"><b>${count}</b> 款${C.name}</div></div>`
      + `<div class="pc-go">›</div>`;
    card.addEventListener('click', () => {
      state.filterPriceRange = range.label;
      state.filterBrand = null;
      state.searchQuery = '';
      navigateTo('list');
    });
    priceGrid.appendChild(card);
  });

  // 品牌
  const brandRow = page.querySelector('#brandRow');
  C.brands.forEach(brand => {

function getFilteredPhones() {
  const C = cat();
  let phones = [...d()];
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    phones = phones.filter(p =>
      p.brand.includes(q) || p.model.toLowerCase().includes(q) || p.id.includes(q)
    );
  }
  if (state.filterBrand) {
    phones = phones.filter(p => p.brand === state.filterBrand);
  }
  if (state.filterPriceRange) {
    phones = phones.filter(p => {
      const price = C.getPrice(p);
      const range = C.priceRanges.find(r => r.label === state.filterPriceRange);
      return range && price >= range.min && price < range.max;
    });
  }
  if (state.filter5G !== null && state.category === 'phone') {
    phones = phones.filter(p => p.features && p.features.fiveG === state.filter5G);
  }
  if (state.filterNFC !== null && state.category === 'phone') {
    phones = phones.filter(p => p.features && p.features.nfc === state.filterNFC);
  }
  if (state.filterDualSim !== null && state.category === 'phone') {
    phones = phones.filter(p => p.features && p.features.dualSim === state.filterDualSim);
  }
  if (state.filterScreenSize) {
    if (state.filterScreenSize === 'small') phones = phones.filter(p => (p.screen||{}).size && p.screen.size <= 6.3);
    else if (state.filterScreenSize === 'medium') phones = phones.filter(p => (p.screen||{}).size && p.screen.size > 6.3 && p.screen.size <= 6.7);
    else if (state.filterScreenSize === 'large') phones = phones.filter(p => (p.screen||{}).size && p.screen.size > 6.7);
  }
  // GPU-specific
  if (state.filterVram && state.category === 'gpu') {
    if (state.filterVram === '8GB') phones = phones.filter(p => (p.specs||{}).vram <= 10);
    else if (state.filterVram === '12GB') phones = phones.filter(p => (p.specs||{}).vram >= 10 && (p.specs||{}).vram <= 14);
    else if (state.filterVram === '16GB+') phones = phones.filter(p => (p.specs||{}).vram >= 16);
  }
  if (state.filterVendor && state.category === 'gpu') {
    phones = phones.filter(p => p.brand === state.filterVendor);
  }
  // AC-specific
  if (state.filterAcType && state.category === 'ac') {
    if (state.filterAcType === '壁挂式') phones = phones.filter(p => (p.specs||{}).type === '壁挂式');
    else if (state.filterAcType === '立柜式') phones = phones.filter(p => (p.specs||{}).type === '立柜式');
  }
  if (state.filterAcHp && state.category === 'ac') {
    if (state.filterAcHp === '1.5匹') phones = phones.filter(p => (p.specs||{}).horsepower === '1.5匹');
    else if (state.filterAcHp === '2匹') phones = phones.filter(p => (p.specs||{}).horsepower === '2匹');
    else if (state.filterAcHp === '3匹') phones = phones.filter(p => (p.specs||{}).horsepower === '3匹');
  }
  // Robot-specific
  if (state.filterStation !== null && state.filterStation !== undefined && state.category === 'robot') {
    phones = phones.filter(p => (p.specs||{}).baseStation === state.filterStation);
  }
  // Laptop-specific
  if (state.filterLaptopScreen && state.category === 'laptop') {
    if (state.filterLaptopScreen === '13寸') phones = phones.filter(p => (p.specs||{}).screen && p.specs.screen.includes('13'));
    else if (state.filterLaptopScreen === '14寸') phones = phones.filter(p => (p.specs||{}).screen && p.specs.screen.includes('14'));
    else if (state.filterLaptopScreen === '15-16寸') phones = phones.filter(p => (p.specs||{}).screen && (p.specs.screen.includes('15') || p.specs.screen.includes('16')));
  }
  // CPU-specific
  if (state.filterCpuBrand && state.category === 'cpu') {
    phones = phones.filter(p => p.brand === state.filterCpuBrand);
  }
  // Earphone-specific
  if (state.filterAnc && state.category === 'earphone') {
    if (state.filterAnc === '主动降噪') phones = phones.filter(p => (p.specs||{}).noise === '主动降噪');
    else if (state.filterAnc === '无降噪') phones = phones.filter(p => (p.specs||{}).noise === '无降噪');
  }
  if (state.filterForm && state.category === 'earphone') {
    if (state.filterForm === '真无线') phones = phones.filter(p => (p.specs||{}).type === '真无线');
    else if (state.filterForm === '头戴式') phones = phones.filter(p => (p.specs||{}).type === '头戴式');
  }
  // Monitor-specific
  if (state.filterMonSize && state.category === 'monitor') {
    if (state.filterMonSize === '24寸') phones = phones.filter(p => (p.specs||{}).size && p.specs.size.includes('24'));
    else if (state.filterMonSize === '27寸') phones = phones.filter(p => (p.specs||{}).size && p.specs.size.includes('27'));
    else if (state.filterMonSize === '32寸+') phones = phones.filter(p => (p.specs||{}).size && (p.specs.size.includes('32') || p.specs.size.includes('43')));
  }
  if (state.filterMonRes && state.category === 'monitor') {
    if (state.filterMonRes === '2K') phones = phones.filter(p => (p.specs||{}).resolution && p.specs.resolution.includes('2560'));
    else if (state.filterMonRes === '4K') phones = phones.filter(p => (p.specs||{}).resolution && p.specs.resolution.includes('3840'));
    else if (state.filterMonRes === '1080P') phones = phones.filter(p => (p.specs||{}).resolution && p.specs.resolution.includes('1920'));
  }
  // 排序
  if (state.sortBy === 'price-asc') {
    phones.sort((a, b) => cat().getPrice(a) - cat().getPrice(b));
  } else if (state.sortBy === 'price-desc') {
    phones.sort((a, b) => cat().getPrice(b) - cat().getPrice(a));
  } else if (state.sortBy === 'newest') {
    phones.sort((a, b) => b.launchDate.localeCompare(a.launchDate));
  } else if (state.sortBy === 'sales') {
    // 销量：基于 popularity 与发布时间加权估算
    phones.sort((a, b) => (b.sales || b.popularity || 50) - (a.sales || a.popularity || 50));
  } else {
    phones.sort((a, b) => b.popularity - a.popularity);
  }
  return phones;
}

function renderFilterChips(containerId, options, selected, onChange) {
  const container = $('#' + containerId);
  if (!container) return;
  container.innerHTML = '';
  options.forEach(opt => {
    const chip = document.createElement('div');
    chip.className = 'fm-chip' + (opt === selected ? ' selected' : '');
    chip.textContent = opt;
    chip.addEventListener('click', () => {
      const newVal = opt === selected ? null : opt;
      onChange(newVal);
      // 重新渲染
      renderFilterChips(containerId, options, newVal, onChange);
    });
    container.appendChild(chip);
  });
  // 同时更新列表页的 filter-chip 样式
  renderFiltered();
}

function renderFiltered() {
  if (state.page === 'list') {
    const listPage = $('#page-list');
    if (listPage) {
      const brandChip = listPage.querySelector('#filterBrandBtn');
      const priceChip = listPage.querySelector('#filterPriceBtn');
      if (brandChip) {
        brandChip.textContent = '品牌' + (state.filterBrand ? '：' + state.filterBrand : '');
        brandChip.className = 'filter-chip' + (state.filterBrand ? ' active' : '');
      }
      if (priceChip) {
        priceChip.textContent = '价格' + (state.filterPriceRange ? '：' + state.filterPriceRange : '');
        priceChip.className = 'filter-chip' + (state.filterPriceRange ? ' active' : '');
      }
    }
    renderPhoneList(listPage);
  }
}

function openStorageModal(phoneId, callback) {
  const phone = getPhone(phoneId);
  if (!phone) return;
  const modal = $('#storageModal');
  const content = $('#smContent');
  const current = state.compareList.find(e => e.phoneId === phoneId);
  const currentStorage = current ? current.storage : phone.defaultStorage;

  content.innerHTML = `
    <div class="sm-header">${phone.model} — 选择容量版本</div>
    ${phone.storageOptions.map(opt => `
      <div class="sm-option${opt.storage === currentStorage ? ' selected' : ''}" data-storage="${opt.storage}">
        <span class="sm-storage">${phone.ram}+${opt.storage}</span>
        <span class="sm-price">¥${Math.min(opt.priceJd, opt.pricePdd)}起</span>
      </div>
    `).join('')}
    <button class="sm-close" id="smClose">取消</button>
  `;

  content.querySelectorAll('.sm-option').forEach(opt => {
    opt.addEventListener('click', function() {
      const storage = this.dataset.storage;
      if (callback) callback(storage);
      modal.classList.remove('show');
    });
  });
  content.querySelector('#smClose').addEventListener('click', () => modal.classList.remove('show'));

  modal.classList.add('show');

  // ==================== 对比逻辑 ====================
  function comparePriceDiff(phones) {
    const prices = phones.map(p => p.priceSrc.price);
    return `<tr><td class="label">价格差异</td>${phones.map((p, i) => {
      const others = phones.filter((_, j) => j !== i).map(x => x.priceSrc.price);
      const minOther = Math.min(...others);
      const maxOther = Math.max(...others);
      const diff = p.priceSrc.price - minOther;
      if (diff === 0) return '<td>最低价</td>';
      const cls = diff > 0 ? 'highlight' : 'highlight-low';
      return `<td class="${cls}">比最低高 ¥${diff}<br><span class="dim-note">比最高${p.priceSrc.price < maxOther ? '低' : '高'} ¥${Math.abs(p.priceSrc.price - maxOther)}</span></td>`;
    }).join('')}</tr>`;
  }

  function formatDiff(value, allValues, unit) {
    const uniq = [...new Set(allValues)];
    if (uniq.length === 1) return `${value}${unit}`;
    const max = Math.max(...allValues);
    const min = Math.min(...allValues);
    if (value === max) return `<span class="highlight">${value}${unit}</span>`;
    if (value === min) return `${value}${unit}`;
    return `${value}${unit}`;
  }

  function formatWeightDiff(weight, allWeights) {
    const uniq = [...new Set(allWeights)];
    if (uniq.length === 1) return `${weight}g`;
    const min = Math.min(...allWeights);
    if (weight === min) return `<span class="highlight-low">${weight}g（最轻）</span>`;
    const max = Math.max(...allWeights);
    if (weight === max) return `${weight}g（最重）`;
    return `${weight}g`;
  }

  function formatBoolDiff(value, allValues) {
    const uniq = [...new Set(allValues)];
    if (uniq.length === 1) return value ? '✅ 支持' : '❌ 不支持';
    return value ? '✅ 支持' : '<span class="highlight-miss">❌ 不支持</span>';
  }

  function generateConclusion(phones) {
    const names = phones.map(p => p.phone.model);
    const prices = phones.map(p => p.priceSrc.price);
    const isPhone = state.category === 'phone';
    const weights = isPhone ? phones.map(p => (p.phone.body||{}).weight || 0) : [];
    const screenSizes = isPhone ? phones.map(p => (p.phone.screen||{}).size || 0) : [];
    const features = phones.map(p => p.phone.features || {});

    const diffs = [];
    if (new Set(prices).size > 1) diffs.push('价格');
    if (isPhone) {
      if (new Set(weights).some(w => w > 0) && new Set(weights).size > 1) diffs.push('重量');
      if (new Set(screenSizes).some(s => s > 0) && new Set(screenSizes).size > 1) diffs.push('屏幕尺寸');
    }
    const mainDiff = diffs.length > 0
      ? '这几款在<span style="font-weight:600">' + diffs.join('、') + '</span>方面存在差异。'
      : '这几款在核心参数上较为接近';

    const items = [];
    const maxPrice = Math.max(...prices);
    const minPrice = Math.min(...prices);
    const maxWeight = weights.length ? Math.max(...weights) : 0;
    const minWeight = weights.length ? Math.min(...weights) : 0;
    const maxScreen = screenSizes.length ? Math.max(...screenSizes) : 0;
    const minScreen = screenSizes.length ? Math.min(...screenSizes) : 0;

    phones.forEach((p, i) => {
      const suitable = [], unsuitable = [], model = p.phone.model;

      if (p.priceSrc.price === minPrice && p.priceSrc.price < maxPrice) suitable.push('预算敏感、追求性价比');
      if (p.priceSrc.price === maxPrice && p.priceSrc.price > minPrice) unsuitable.push('对价格敏感');

      if (isPhone) {
        if ((p.phone.body||{}).weight === minWeight && minWeight < maxWeight) suitable.push('重视轻便和单手操作');
        if ((p.phone.body||{}).weight === maxWeight && maxWeight > minWeight) unsuitable.push('追求极致轻便');
        if ((p.phone.screen||{}).size === maxScreen && maxScreen > minScreen) suitable.push('影音娱乐、大屏阅读');
        if ((p.phone.screen||{}).size === minScreen && minScreen < maxScreen) suitable.push('偏好小巧机身、单手操作');
      }
      if (isPhone && (p.phone.screen||{}).size < 6.3 && phones.some(x => (x.phone.screen||{}).size >= 6.7)) {
        unsuitable.push('喜欢大屏影音体验的用户');
      }

      // 存储
      if (p.phone.ram && parseInt(p.phone.ram) >= 12) suitable.push('多任务重度使用');

      // 功能 (phone only)
      if (isPhone) {
        const allNfc = phones.map(x => (x.phone.features||{}).nfc);
        if (!(p.phone.features||{}).nfc && allNfc.some(x => x)) unsuitable.push('需要NFC（公交/门禁）');
        if (!(p.phone.features||{}).infrared && phones.some(x => (x.phone.features||{}).infrared)) unsuitable.push('需要用手机遥控家电');
        if (!(p.phone.features||{}).satellite && phones.some(x => (x.phone.features||{}).satellite)) unsuitable.push('需卫星通信');
        if ((p.phone.features||{}).satellite && !phones.every(x => (x.phone.features||{}).satellite)) suitable.push('户外爱好者、需卫星通信');
      }

      // 品牌生态
      if (p.phone.brand === '苹果') suitable.push('苹果生态用户（Mac/iPad/AirPods 联动）');
      if (p.phone.brand === '华为') suitable.push('鸿蒙生态用户（平板/手表/车机联动）');
      if (p.phone.brand === '小米') suitable.push('米家智能家居用户');

      items.push({
        model,
        suitable: suitable.slice(0, 3).join('；') || '无明显突出优势',
        unsuitable: unsuitable.slice(0, 3).join('；') || '无明显短板',
        typeSuitable: suitable.length > 0,
        typeUnsuitable: unsuitable.length > 0
      });
    });

    const resultItems = [];
    items.forEach(item => {
      if (item.suitable !== '无明显突出优势') {
        resultItems.push({ type: 'suitable', model: item.model, text: item.suitable });
      }
      if (item.unsuitable !== '无明显短板') {
        resultItems.push({ type: 'unsuitable', model: item.model, text: item.unsuitable });
      }
    });

    return { mainDiff, items: resultItems };
  }

  function checkHelpComplete() {
    // 至少点过一题就激活（不再强制全选）
    $('#hmSubmit').disabled = !helpInteracted;
  }

  function generateHelpResult() {
    const phones = getComparePhones();
    // 手机专用：计算最小重量 / 最大屏幕（供打分维度使用）
    const weights = phones.map(x => (x.phone.body || {}).weight).filter(w => typeof w === 'number');
    const minWeight = weights.length ? Math.min(...weights) : 0;
    const sizes = phones.map(x => (x.phone.screen || {}).size).filter(s => typeof s === 'number');
    const maxSize = sizes.length ? Math.max(...sizes) : 0;
    // 记录本轮用户实际回答的需求问题数（用于质量自评的匹配度分母）
    const answeredCount = Object.keys(helpAnswers).filter(k => k !== 'brand' || helpAnswers.brand !== 'none').length;
    // 评分
    const scores = phones.map(p => {
      let score = 0;
      const reasons = [];
      const tradeoffs = [];

      // 品牌偏好
      if (helpAnswers.brand !== 'none' && p.phone.brand === helpAnswers.brand) {
        score += 30;
        reasons.push(`符合你的${p.phone.brand}品牌偏好`);
      }

      // 价格
      const prices = phones.map(x => x.priceSrc.price);
      const minPrice = Math.min(...prices);
      if (helpAnswers.budget === 'no') {
        if (p.priceSrc.price === minPrice) { score += 25; reasons.push('价格最低，符合你的预算要求'); }
        else { tradeoffs.push(`价格比最低的高 ¥${p.priceSrc.price - minPrice}`); }
      } else if (helpAnswers.budget === 'little') {
        if (p.priceSrc.price <= minPrice * 1.15) { score += 15; reasons.push('价格在可接受范围内'); }
        else { tradeoffs.push(`价格超出最低预算约 ${Math.round((p.priceSrc.price - minPrice) / minPrice * 100)}%`); }
      } else {
        score += 10;
      }

      // 品类特定评分
      if (state.category === 'phone') {
        if (helpAnswers.prefer === 'light') { if ((p.phone.body||{}).weight === minWeight) { score += 20; reasons.push('最轻的机型'); } else if ((p.phone.body||{}).weight > minWeight + 20) tradeoffs.push('比最轻的重' + ((p.phone.body||{}).weight - minWeight) + 'g'); }
        else if (helpAnswers.prefer === 'big') { if ((p.phone.screen||{}).size === maxSize) { score += 20; reasons.push('屏幕最大'); } else if ((p.phone.screen||{}).size < maxSize - 0.3) tradeoffs.push('屏幕相对较小'); }
        if (helpAnswers.features === 'must') { const f=[(p.phone.features||{}).nfc,(p.phone.features||{}).infrared,(p.phone.features||{}).satellite].filter(Boolean).length; score+=f*7; if(f>=3)reasons.push('NFC/红外/卫星齐全'); }
        else if (helpAnswers.features === 'nfc') { if((p.phone.features||{}).nfc){score+=10;reasons.push('支持NFC');}else{tradeoffs.push('不支持NFC');score-=5;} }
        if (helpAnswers.weight === 'no' && (p.phone.body||{}).weight > 200) { tradeoffs.push('超过200g'); score -= 5; }
        if ((p.phone.screen||{}).refreshRate >= 120) score += 5;
        if (((p.phone.features||{}).waterproof||'').includes('IP68')) score += 3;
        if ((p.phone.ram && parseInt(p.phone.ram)) >= 12) score += 3;
      } else if (state.category === 'gpu') {
        if (helpAnswers.storage === 'yes') { if ((p.phone.specs||{}).vram >= 16) { score += 20; reasons.push('大显存适合AI/4K'); } else tradeoffs.push('显存较小'); }
        if (helpAnswers.prefer === 'big') { if ((p.phone.specs||{}).tdp >= 300) score += 15; else tradeoffs.push('性能可能不足'); }
        else if (helpAnswers.prefer === 'light') { if ((p.phone.specs||{}).tdp <= 200) { score += 15; reasons.push('低功耗'); } else tradeoffs.push('功耗较高'); }
      } else if (state.category === 'ac') {
        if (helpAnswers.prefer === 'light') { if (((p.phone.specs||{}).horsepower||'').includes('1.5')) { score += 20; reasons.push('适合卧室'); } }
        else if (helpAnswers.prefer === 'big') { if (((p.phone.specs||{}).horsepower||'').includes('3')) { score += 20; reasons.push('适合客厅'); } }
      } else if (state.category === 'robot') {
        if (helpAnswers.features === 'must') { if ((p.phone.specs||{}).baseStation) { score += 20; reasons.push('全能基站'); } else tradeoffs.push('无全能基站'); }
      } else if (state.category === 'laptop') {
        if (helpAnswers.prefer === 'light') { if (parseFloat((p.phone.specs||{}).weight||'2') < 1.3) { score += 20; reasons.push('超轻便'); } else tradeoffs.push('偏重'); }
        else if (helpAnswers.prefer === 'big') { if (parseFloat((p.phone.specs||{}).weight||'1') >= 1.5) { score += 15; reasons.push('性能更优'); } }
      } else if (state.category === 'cpu') {
        if (helpAnswers.prefer === 'big') { if (parseInt((p.phone.specs||{}).cores) >= 16) { score += 20; reasons.push('多核性能强'); } }
        else if (helpAnswers.prefer === 'light') { if (parseInt((p.phone.specs||{}).tdp) <= 65) { score += 15; reasons.push('低功耗省电'); } }
      } else if (state.category === 'earphone') {
        if (helpAnswers.features === 'must') { if (((p.phone.specs||{}).noise||'').includes('主动降噪')) { score += 20; reasons.push('主动降噪'); } else tradeoffs.push('无降噪'); }
      } else if (state.category === 'monitor') {
        if (helpAnswers.prefer === 'big') { if (((p.phone.specs||{}).resolution||'').includes('3840')) { score += 20; reasons.push('4K分辨率'); } }
        else if (helpAnswers.prefer === 'light') { if (parseInt((p.phone.specs||{}).refreshRate) >= 144) { score += 20; reasons.push('高刷新率'); } }
      }

      return { ...p, score, reasons, tradeoffs };
    });

    scores.sort((a, b) => b.score - a.score);
    const best = scores[0];
    const runnerUp = scores[1] || null;

    // ===== 置信度模型：把原始分归一化，并结合"领先优势"计算置信度 =====
    const rawScores = scores.map(s => s.score);
    const maxScore = Math.max(...rawScores);
    const minScore = Math.min(...rawScores);
    const range = maxScore - minScore;
    // 每款产品的归一化匹配度（0-100）
    scores.forEach(s => { s.matchPct = range > 0 ? Math.round(((s.score - minScore) / range) * 100) : 50; });
    // 置信度 = 基础分(领先幅度) + 理由充分度，压到 55-96 区间避免虚高/虚低
    const lead = runnerUp ? best.score - runnerUp.score : best.score;
    const leadNorm = maxScore > 0 ? Math.min(lead / maxScore, 1) : 0;
    const reasonBonus = Math.min(best.reasons.length * 4, 16);
    let confidence = Math.round(55 + leadNorm * 30 + reasonBonus);
    confidence = Math.max(55, Math.min(96, confidence));
    const verdict = confidence >= 85 ? '强烈推荐 · 优势明显' : confidence >= 72 ? '推荐 · 综合占优' : '倾向推荐 · 差距较小';

    // ===== AI 推荐质量自评指标 =====
    // 1) 需求覆盖度：本轮命中理由的维度 / 用户回答的问题数
    const coverage = answeredCount > 0 ? Math.min(Math.round((best.reasons.length / answeredCount) * 100), 100) : 100;
    // 2) 候选区分度：Top1 与 Top2 的匹配度差，越大说明结论越可靠
    const separation = runnerUp ? Math.min(best.matchPct - runnerUp.matchPct, 100) : 100;
    // 3) 数据完整度：被推荐产品关键字段的非空比例
    const keyFields = [best.phone.brand, best.phone.model, best.priceSrc && best.priceSrc.price, best.phone.launchDate, JSON.stringify(best.phone.specs || best.phone.screen || {})];
    const completeness = Math.round(keyFields.filter(Boolean).length / keyFields.length * 100);
    // 4) 权衡透明度：是否如实暴露了取舍（暴露风险 = 更可信）
    const transparency = best.tradeoffs.length > 0 ? 100 : (answeredCount <= 1 ? 70 : 85);

    const metricColor = v => v >= 80 ? 'g' : v >= 60 ? 'b' : 'y';
    const qaMetric = (label, val, unit) => '<div class="qa-metric"><div class="qa-m-label"><span>' + label + '</span><b>' + val + (unit || '%') + '</b></div><div class="qa-m-track"><div class="qa-m-fill ' + metricColor(val) + '" style="width:' + val + '%"></div></div></div>';

    let qaNote;
    if (coverage < 60) qaNote = '本轮你的偏好在候选产品间区分度有限，建议补充更多筛选条件以提升推荐针对性。';
    else if (separation < 15) qaNote = '前两名综合评分接近，属于"都不错"的情况，可参考取舍项按个人侧重做最终决定。';
    else qaNote = '推荐结论区分度良好、数据完整，可作为可信的决策参考。';

    // ===== 组装 HTML =====
    const ring = (() => {
      const r = 24, c = 2 * Math.PI * r, off = c * (1 - confidence / 100);
      return '<div class="hr-conf-ring"><svg width="56" height="56"><circle cx="28" cy="28" r="' + r + '" fill="none" stroke="#e0e7ff" stroke-width="6"/><circle cx="28" cy="28" r="' + r + '" fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg><div class="hr-conf-num">' + confidence + '%</div></div>';
    })();

    const scoreBars = scores.map((s, i) => {
      return '<div class="hr-sb-item"><div class="hr-sb-head"><span class="hr-sb-name">' + s.phone.brand + ' ' + s.phone.model + '</span><span class="hr-sb-val">' + s.matchPct + '</span></div><div class="hr-sb-track"><div class="hr-sb-fill' + (i === 0 ? '' : ' second') + '" style="width:' + s.matchPct + '%"></div></div></div>';
    }).join('');

    const result = $('#helpResult');
    result.innerHTML =
      '<div class="hr-title">📌 AI 智能推荐 <span class="ai-badge">⚡ 决策引擎</span></div>' +
      '<div class="hr-model">' + best.phone.brand + ' ' + best.phone.model + '</div>' +
      '<div class="hr-conf-row">' + ring + '<div class="hr-conf-meta"><div class="hr-conf-label">推荐置信度</div><div class="hr-conf-verdict">' + verdict + '</div></div></div>' +
      '<div class="hr-reasons"><div style="font-weight:700;font-size:13px;margin-bottom:6px;">推荐理由：</div><ul>' + (best.reasons.length ? best.reasons.map(r => '<li>' + r + '</li>').join('') : '<li>综合各项参数表现均衡</li>') + '</ul></div>' +
      (best.tradeoffs.length > 0 ? '<div class="hr-tradeoff">⚠️ 需要接受的取舍：' + best.tradeoffs.join('；') + '</div>' : '') +
      '<div style="font-weight:700;font-size:13px;margin:10px 0 6px;">候选匹配度对比：</div><div class="hr-scorebar">' + scoreBars + '</div>' +
      '<div class="hr-others" style="margin-top:8px;">' + scores.filter((_, i) => i > 0).map(s => '<div style="margin-bottom:4px"><strong>' + s.phone.model + '</strong> 更适合：' + (s.reasons.length > 0 ? s.reasons.join('；') : '综合评分较低') + '</div>').join('') + '</div>' +
      '<div class="qa-panel">' +
        '<div class="qa-title">🔍 AI 推荐质量自评</div>' +
        '<div class="qa-sub">推荐引擎对本次输出结果的自我评估，用于衡量结论的可信度（借鉴模型评测思路）</div>' +
        '<div class="qa-metrics">' +
          qaMetric('需求覆盖度', coverage) +
          qaMetric('候选区分度', separation) +
          qaMetric('数据完整度', completeness) +
          qaMetric('权衡透明度', transparency) +
        '</div>' +
        '<div class="qa-note"><b>自评结论：</b>' + qaNote + '</div>' +
      '</div>';
    result.classList.add('show');
    result.scrollIntoView({ behavior: 'smooth' });
  }

  // 各品类的输入占位与示例
  const AI_PRESETS = {

  // 解析品牌
  function parseAiBrand(q) {

  // 解析语义意图
  function parseAiIntents(q) {
    const list = AI_INTENTS[state.category] || [];
