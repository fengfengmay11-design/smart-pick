  // 阶段二后端地址：优先调用云端大模型解析意图，不可用则自动降级本地规则
  const AI_BACKEND = 'http://127.0.0.1:8000';

  // 意图解析：优先云端大模型，失败/超时/未启动 → 降级本地正则关键词
  async function resolveAiIntent(query) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      const resp = await fetch(AI_BACKEND + '/api/parse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, category: state.category }),
        signal: ctrl.signal,
      });
      clearTimeout(timer);
      const res = await resp.json();
      if (res && res.ok && res.engine === 'llm') {
        const labels = res.intent.intents || [];
        const list = AI_INTENTS[state.category] || [];
        const intents = list.filter(it => labels.includes(it.label));
        const brand = (res.intent.brand && cat().brands.includes(res.intent.brand)) ? res.intent.brand : parseAiBrand(query);
        const budget = (typeof res.intent.budget === 'number') ? res.intent.budget : parseAiBudget(query);
        return { budget, brand, intents, engine: 'llm', model: res.model, latency: res.latency_ms, user: res.intent.user || null };
      }
    } catch (e) { /* 网络错误/超时/后端未启动 → 走降级 */ }
    return { budget: parseAiBudget(query), brand: parseAiBrand(query), intents: parseAiIntents(query), engine: 'local', user: null };
  }

  // 打开 AI 选购弹窗并给出推荐
  async function openAiShop(query) {
    // AI 选购独立于下方选中标签：先从用户描述里识别目标品类
    const detected = detectCategory(query);
    let switchedNote = '';
    if (detected && detected !== state.category) {
      // 自动切到识别出的品类，保证数据源、"加入对比"等后续操作与推荐结果一致
      state.category = detected;
      state.filterBrand = null;
      state.filterPriceRange = null;
      state.sortBy = cat().defaultSort;
      state.compareList = [];
      state.searchQuery = '';
      switchedNote = '已自动切换到「' + cat().name + '」品类';
      navigateTo('home');
    }

    const C = cat();
    const data = d();

    // 先弹出加载态（大模型可能要等 1~3 秒）
    $('#amContent').innerHTML = '<div class="am-head"><div class="am-title">✨ AI 正在理解你的需求…</div><span class="am-close" id="amCloseL">✕</span></div>'
      + '<div style="padding:34px 10px;text-align:center;color:var(--text-muted);font-size:14px;line-height:1.8;">正在解析：<b>' + escapeHtml(query) + '</b><br><span style="font-size:12px;">连接云端大模型中，若未启动后端将自动使用本地规则…</span></div>';
    $('#aiModal').classList.add('show');
    const _lc = $('#amContent').querySelector('#amCloseL');
    if (_lc) _lc.addEventListener('click', () => $('#aiModal').classList.remove('show'));

    const resolved = await resolveAiIntent(query);
    const budget = resolved.budget;
    const brand = resolved.brand;
    const intents = resolved.intents;
    const aiEngine = resolved.engine;
    const aiUser = resolved.user;
    const aiModel = resolved.model;
    const aiLatency = resolved.latency;

    // 全库打分
    const scored = data.map(item => {
      const price = C.getPrice(item);
      const specs = item.specs || {};
      const tags = item.tags || [];
      let score = 0; const reasons = []; const tradeoffs = [];

      // 预算：硬过滤 + 渐进扣分
      // 超过预算 2 倍的产品直接排除（不可能推荐给用户）
      if (budget) {
        const ratio = price / budget;
        if (ratio <= 1) {
          score += 25; // 预算内，加分
        } else if (ratio <= 1.15) {
          score += 8;
          tradeoffs.push('略超预算约' + Math.round((ratio - 1) * 100) + '%');
        } else if (ratio <= 2) {
          // 115%~200%：渐进重罚，不封顶（原来 -40 封顶导致 55 倍超预算才扣 40 分）
          score -= Math.round((ratio - 1.15) * 80);
          tradeoffs.push('超预算' + Math.round((ratio - 1) * 100) + '%');
        } else {
          // 超过 2 倍预算：直接排除
          score = -999;
        }
      }
      // 品牌
      if (brand && item.brand === brand) { score += 20; reasons.push('符合你想要的' + brand + '品牌'); }

      // 语义意图
      intents.forEach(it => {
        if (it.dim) {
          const v = it.dim(specs); // 0-1
          score += Math.round(v * 22);
          if (v >= 0.6) reasons.push(it.label);
          else if (v <= 0.25) tradeoffs.push(it.label + '一般');
        } else if (it.tagAny) {
          const hit = tags.some(t => it.tagAny.some(k => String(t).includes(k)));
          if (hit) { score += 18; reasons.push(it.label); }
        }
      });

      // 热度作为轻微加权（同分时更受欢迎的优先）
      score += (item.popularity || item.sales || 50) * 0.06;

      return { item, price, score, reasons, tradeoffs };
    });

    scored.sort((a, b) => b.score - a.score);
    let top = scored.slice(0, 3);
    let best = top[0];
    const runnerUp = top[1] || null;

    // 预算兜底：如果所有候选都被预算排除（score <= 0），回退到「最接近预算」模式
    // 并在 UI 上明确提示用户预算与数据不匹配
    let budgetFallback = false;
    if (budget && top.length > 0 && top[0].score <= 0) {
      budgetFallback = true;
      // 按价格升序重排，取最便宜的 3 款（至少给用户一个参考）
      const byPrice = [...scored].sort((a, b) => a.price - b.price);
      top = byPrice.slice(0, 3).map(s => ({
        ...s,
        score: Math.max(s.score, 1),  // 避免负分导致 matchPct 异常
        reasons: s.reasons.length ? s.reasons : ['当前数据集中价格最低的选项'],
        tradeoffs: [...(s.tradeoffs || []), '远超预算，仅供参考'],
      }));
      best = top[0];
    }

    // 归一化匹配度
    const raw = top.map(s => s.score);
    const maxS = Math.max(...raw), minS = Math.min(...scored.map(s => s.score));
    const range = maxS - minS;
    top.forEach(s => { s.matchPct = range > 0 ? Math.round(((s.score - minS) / range) * 100) : 60; });

    // ===== 阶段三：调用大模型生成个性化推荐内容 =====
    let aiRec = null; // { reason, comparison, advice, summary }
    if (aiEngine === 'llm') {
      try {
        const prodSummaries = top.map((s, i) => ({
          rank: i + 1,
          brand: s.item.brand,
          model: s.item.model,
          price: s.price,
          score: s.score,
          match_pct: s.matchPct,
          reasons: s.reasons,
          tradeoffs: s.tradeoffs,
          specs: s.item.specs || null,
        }));
        const recCtrl = new AbortController();
        const recTimer = setTimeout(() => recCtrl.abort(), 12000);
        const recResp = await fetch(AI_BACKEND + '/api/recommend', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query, category: state.category,
            intent: { budget, brand, intents, user: aiUser },
            products: prodSummaries,
          }),
          signal: recCtrl.signal,
        });
        clearTimeout(recTimer);
        if (recResp.ok) {
          const recData = await recResp.json();
          if (recData.ok && recData.recommendation) aiRec = recData.recommendation;
        }
      } catch (e) { /* 推荐内容生成失败 → 降级到模板 */ }
    }

    // 置信度
    const lead = runnerUp ? best.score - runnerUp.score : best.score;
    const leadNorm = maxS > 0 ? Math.min(Math.abs(lead) / Math.max(Math.abs(maxS), 1), 1) : 0;
    const reasonBonus = Math.min(best.reasons.length * 4, 16);
    let confidence = Math.max(55, Math.min(96, Math.round(58 + leadNorm * 28 + reasonBonus)));
    const verdict = confidence >= 85 ? '强烈推荐 · 高度匹配' : confidence >= 72 ? '推荐 · 匹配度高' : '倾向推荐 · 可再看看';

    // 意图解析展示
    const intentTags = [];
    intentTags.push({ t: '📦 ' + C.name, miss: false });
    if (budget) intentTags.push({ t: '💰 预算约 ¥' + budget, miss: false });
    if (brand) intentTags.push({ t: '🏷️ ' + brand, miss: false });
    if (aiUser) intentTags.push({ t: '👤 ' + aiUser, miss: false });
    intents.forEach(it => intentTags.push({ t: '✓ ' + it.label, miss: false }));
    if (intentTags.length === 0) intentTags.push({ t: '未识别到明确条件，按综合热度推荐', miss: true });

    // 引擎标识徽章：云端大模型 / 本地规则
    const engineBadge = aiEngine === 'llm'
      ? '<span class="ai-engine-badge llm">☁️ 云端大模型 · ' + (aiModel || 'LLM') + (aiLatency ? ' · ' + aiLatency + 'ms' : '') + '</span>'
      : '<span class="ai-engine-badge local">⚡ 本地规则引擎（未连后端）</span>';

    // 质量自评
    const parsedCount = (budget ? 1 : 0) + (brand ? 1 : 0) + intents.length;
    const coverage = parsedCount > 0 ? Math.min(Math.round(best.reasons.length / parsedCount * 100), 100) : 60;
    const separation = runnerUp ? Math.max(Math.min(best.matchPct - runnerUp.matchPct, 100), 0) : 100;
    const understanding = Math.min(parsedCount * 30 + 10, 100); // 意图理解度：识别到的条件越多越高
    const inBudget = budget ? (best.price <= budget * 1.05 ? 100 : 60) : 80;
    const metricColor = v => v >= 80 ? 'g' : v >= 60 ? 'b' : 'y';
    const qaMetric = (label, val) => '<div class="qa-metric"><div class="qa-m-label"><span>' + label + '</span><b>' + val + '%</b></div><div class="qa-m-track"><div class="qa-m-fill ' + metricColor(val) + '" style="width:' + val + '%"></div></div></div>';

    let qaNote;
    if (parsedCount === 0) qaNote = '没能从你的描述里识别出预算或明确偏好，当前按综合热度推荐。试试说"预算XXX + 你最看重的点"。';
    else if (separation < 15) qaNote = '前几名匹配度接近，都比较符合需求，可结合取舍项按个人侧重定夺。';
    else qaNote = '已理解你的核心诉求，Top1 匹配度明显领先，可作为可信的选购参考。';

    // 组装
    const ring = (() => {
      const r = 24, c = 2 * Math.PI * r, off = c * (1 - confidence / 100);
      return '<div class="hr-conf-ring"><svg width="56" height="56"><circle cx="28" cy="28" r="' + r + '" fill="none" stroke="#e0e7ff" stroke-width="6"/><circle cx="28" cy="28" r="' + r + '" fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg><div class="hr-conf-num">' + confidence + '%</div></div>';
    })();
    const scoreBars = top.map((s, i) => '<div class="hr-sb-item"><div class="hr-sb-head"><span class="hr-sb-name">' + s.item.brand + ' ' + s.item.model + '</span><span class="hr-sb-val">' + s.matchPct + '</span></div><div class="hr-sb-track"><div class="hr-sb-fill' + (i === 0 ? '' : ' second') + '" style="width:' + s.matchPct + '%"></div></div></div>').join('');

    const content = $('#amContent');

    // ===== 构建 AI 增强内容片段 =====
    const aiReasonHtml = aiRec && aiRec.reason
      ? '<div class="ai-reason"><div class="ai-r-label">💡 AI 推荐理由</div>' + aiRec.reason + '</div>'
      : '<div class="hr-reasons"><div style="font-weight:700;font-size:13px;margin-bottom:6px;">推荐理由：</div><ul>' + (best.reasons.length ? [...new Set(best.reasons)].map(r => '<li>' + r + '</li>').join('') : '<li>综合热度与参数表现均衡</li>') + '</ul></div>';

    const aiCompareHtml = aiRec && aiRec.comparison
      ? '<div class="ai-compare"><div class="ai-c-label">⚖️ 候选对比分析</div>' + top.map((s, i) => {
          const rankClass = i === 0 ? 'r1' : i === 1 ? 'r2' : 'r3';
          return '<div class="ai-c-item"><div class="ai-c-rank ' + rankClass + '">' + (i + 1) + '</div><div class="ai-c-body"><div class="ai-c-name">' + s.item.brand + ' ' + s.item.model + '</div><div class="ai-c-detail">¥' + s.price + ' · 匹配度 ' + s.matchPct + '%</div></div></div>';
        }).join('') + '<div style="margin-top:8px;font-size:12.5px;line-height:1.7;color:var(--text-secondary);padding-left:32px;">' + aiRec.comparison + '</div></div>'
      : '';

    const aiAdviceHtml = aiRec && aiRec.advice
      ? '<div class="ai-advice"><div class="ai-a-label">📋 决策建议</div><ul class="ai-a-list"><li>' + aiRec.advice.replace(/\n/g, '</li><li>') + '</li></ul></div>'
      : '';

    const aiSummaryHtml = aiRec && aiRec.summary
      ? '<div class="ai-summary">🎯 ' + aiRec.summary + '</div>'
      : '';

    // 追问区域（仅大模型可用时显示）
    const aiFollowupHtml = aiEngine === 'llm'
      ? '<div class="ai-followup" id="aiFollowupSection">'
        + '<div class="ai-f-label">💬 还有疑问？可以继续追问</div>'
        + '<div class="ai-f-inputwrap"><input type="text" class="ai-f-input" id="aiFollowInput" placeholder="例如：为什么不是iPhone？这款和第二款比呢？" /><button class="ai-f-btn" id="aiFollowBtn">追问</button></div>'
        + '<div class="ai-f-answer" id="aiFollowAnswer"></div>'
        + '</div>'
      : '';

    // 预算严重不足时：用委婉提示替代推荐结果
    const minPrice = scored.length ? [...scored].sort((a,b) => a.price - b.price)[0].price : 0;
    const budgetRatio = budget && minPrice ? (minPrice / budget) : 0;
    const catLabel = (CATEGORIES[state.category] || {}).name || state.category;

    if (budgetFallback) {
      // ===== 预算不足模式：委婉提示 + 仅供参考的最低价选项 =====
      const refItems = top.slice(0, 3).map(s =>
        '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg);border-radius:10px;margin-bottom:8px;">'
        + '<div><div style="font-weight:700;font-size:14px;color:var(--text-primary);">' + s.item.brand + ' ' + s.item.model + '</div>'
        + '<div style="font-size:12px;color:var(--text-hint);margin-top:2px;">参考价 ¥' + s.price + ' · 超预算约 ' + Math.round((s.price - budget) / budget * 100) + '%</div></div>'
        + '<button class="hm-submit" style="padding:6px 14px;font-size:12px;" data-pid="' + s.item.id + '">查看</button>'
        + '</div>'
      ).join('');

      content.innerHTML =
        '<div class="am-head"><div class="am-title">✨ AI 选购结果</div><span class="am-close" id="amClose">✕</span></div>' +
        '<div class="am-query">你的需求：<b>' + escapeHtml(query) + '</b></div>' +
        (switchedNote ? '<div style="font-size:12px;color:var(--primary);margin:-4px 0 8px;font-weight:600;">🔀 ' + switchedNote + '</div>' : '') +
        '<div class="am-intent"><div class="am-intent-label">AI 意图解析 ' + engineBadge + '</div><div class="am-intent-tags">' +
          intentTags.map(t => '<span class="am-itag' + (t.miss ? ' miss' : '') + '">' + escapeHtml(t.t) + '</span>').join('') +
        '</div></div>' +
        '<div class="help-result show" style="margin-top:14px;">' +
          // 委婉提示主体
          '<div style="text-align:center;padding:24px 16px 16px;">'
          + '<div style="font-size:42px;line-height:1;margin-bottom:12px;">💰</div>'
          + '<div style="font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:8px;">预算可能需要调整一下</div>'
          + '<div style="font-size:13px;color:var(--text-secondary);line-height:1.7;max-width:320px;margin:0 auto 16px;">'
            + '你提到的预算 <b>¥' + budget + '</b> ，但目前「' + catLabel + '」品类中价格最低的产品也要 <b>¥' + minPrice + '</b>（约是你预算的 <b>' + Math.round(budgetRatio) + ' 倍</b>）。<br><br>'
            + '这不是说不能买——只是在这个价位区间，全新机可能比较难找到合适的选择。你可以考虑：'
          + '</div>'
          + '<div style="text-align:left;background:var(--bg);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--text-secondary);line-height:2;">'
            + '🔄 <b>适当加一点预算</b> —— 如果能到 ¥' + Math.round(minPrice * 1.1) + ' 左右，就能有不错的入门选择了<br>'
            + '📱 <b>二手 / 翻新机</b> —— 同款机型二手价通常只有新机的 5~7 折<br>'
            + '⏳ <b>等促销活动</b> —— 618 / 双11 / 百亿补贴经常有惊喜价<br>'
            + '🔍 <b>换一个品类</b> —— 如果不是必须「' + catLabel + '」，也许其他品类有更实惠的选择'
          + '</div>'
          + '</div>'
          // 仅供参考区域
          + '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">'
          + '<div style="font-size:12px;color:var(--text-hint);margin-bottom:10px;">📋 以下是目前数据集中最接近你预算的选项（<b>仅供参考</b>，均超预算）：</div>'
          + refItems
          + '</div>'
          // 追问（LLM 可用时保留）
          + aiFollowupHtml
        + '</div>';
    } else {
      // ===== 正常推荐模式 =====
      content.innerHTML =
        '<div class="am-head"><div class="am-title">✨ AI 选购结果</div><span class="am-close" id="amClose">✕</span></div>' +
        '<div class="am-query">你的需求：<b>' + escapeHtml(query) + '</b></div>' +
        (switchedNote ? '<div style="font-size:12px;color:var(--primary);margin:-4px 0 8px;font-weight:600;">🔀 ' + switchedNote + '</div>' : '') +
        '<div class="am-intent"><div class="am-intent-label">AI 意图解析 ' + engineBadge + '</div><div class="am-intent-tags">' +
          intentTags.map(t => '<span class="am-itag' + (t.miss ? ' miss' : '') + '">' + escapeHtml(t.t) + '</span>').join('') +
        '</div></div>' +
        '<div class="help-result show" style="margin-top:14px;">' +
          '<div class="hr-title">📌 为你推荐 <span class="ai-badge">' + (aiRec ? '☁️ 大模型增强' : '⚡ 决策引擎') + '</span></div>' +
          '<div class="hr-model">' + best.item.brand + ' ' + best.item.model + '</div>' +
          '<div style="font-size:13px;color:var(--primary);font-weight:700;margin:-6px 0 10px;">参考价 ¥' + best.price + '</div>' +
          '<div class="hr-conf-row">' + ring + '<div class="hr-conf-meta"><div class="hr-conf-label">推荐置信度</div><div class="hr-conf-verdict">' + verdict + '</div></div></div>' +
          aiReasonHtml +
          (best.tradeoffs.length && !aiRec ? '<div class="hr-tradeoff">⚠️ 需要接受的取舍：' + [...new Set(best.tradeoffs)].join('；') + '</div>' : '') +
          aiCompareHtml +
          '<div style="font-weight:700;font-size:13px;margin:10px 0 6px;">候选匹配度对比：</div><div class="hr-scorebar">' + scoreBars + '</div>' +
          aiAdviceHtml +
          aiSummaryHtml +
          '<div class="qa-panel"><div class="qa-title">🔍 AI 推荐质量自评</div><div class="qa-sub">引擎对本次自然语言理解与推荐结果的自我评估（借鉴模型评测思路）</div><div class="qa-metrics">' +
            qaMetric('意图理解度', understanding) + qaMetric('需求覆盖度', coverage) + qaMetric('候选区分度', separation) + qaMetric('预算契合度', inBudget) +
          '</div><div class="qa-note"><b>自评结论：</b>' + qaNote + '</div></div>' +
          aiFollowupHtml +
          '<div style="margin-top:14px;display:flex;gap:8px;">' +
            '<button class="hm-submit" id="amAddCompare" style="flex:1;">加入对比</button>' +
          '</div>' +
        '</div>';
    }

    const modal = $('#aiModal');
    modal.classList.add('show');
    content.querySelector('#amClose').addEventListener('click', () => modal.classList.remove('show'));

    // 「加入对比」按钮仅正常推荐模式存在
    const addCmpBtn = content.querySelector('#amAddCompare');
    if (addCmpBtn) {
      addCmpBtn.addEventListener('click', () => {
        top.slice(0, 3).forEach(s => { if (canAddCompare() && !isInCompare(s.item.id)) state.compareList.push({ phoneId: s.item.id, storage: s.item.defaultStorage || 'default' }); });
        renderCompareBar();
        modal.classList.remove('show');
        toast('已加入对比，向下滑动查看');
      });
    }

    // 追问功能（仅大模型模式）
    const followBtn = content.querySelector('#aiFollowBtn');
    const followInput = content.querySelector('#aiFollowInput');
    const followAnswer = content.querySelector('#aiFollowAnswer');
    if (followBtn && followInput && followAnswer) {
      let convHistory = [
        { role: 'assistant', content: '已根据你的需求「' + query + '」推荐了 ' + best.item.brand + ' ' + best.item.model + ' 等产品。' + (aiRec && aiRec.reason ? '\n推荐理由：' + aiRec.reason : '') }
      ];
      const doFollowup = async () => {
        const q = followInput.value.trim();
        if (!q.length) return;
        followBtn.disabled = true;
        followBtn.textContent = '思考中…';
        followAnswer.innerHTML = '<div class="ai-llm-loading"><span class="spinner"></span>AI 正在回答…</div>';
        followAnswer.classList.add('show');
        convHistory.push({ role: 'user', content: q });
        try {
          const prodSummaries = top.map((s, i) => ({
            rank: i + 1, brand: s.item.brand, model: s.item.model,
            price: s.price, score: s.score, match_pct: s.matchPct,
            reasons: s.reasons, tradeoffs: s.tradeoffs, specs: s.item.specs || null,
          }));
          const fCtrl = new AbortController();
          const fTimer = setTimeout(() => fCtrl.abort(), 10000);
          const fResp = await fetch(AI_BACKEND + '/api/followup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query, category: state.category,
              followup_question: q,
              conversation_history: convHistory.slice(-8),
              context_products: prodSummaries,
            }),
            signal: fCtrl.signal,
          });
          clearTimeout(fTimer);
          if (fResp.ok) {
            const fData = await fResp.json();
            if (fData.ok && fData.answer) {
              followAnswer.innerHTML = '<div style="white-space:pre-line;">' + escapeHtml(fData.answer) + '</div>';
              convHistory.push({ role: 'assistant', content: fData.answer });
            } else {
              followAnswer.innerHTML = '<div style="color:var(--error,#dc2626);">抱歉，暂时无法回答这个问题。</div>';
            }
          } else {
            followAnswer.innerHTML = '<div style="color:var(--error,#dc2626);">网络请求失败，请稍后重试。</div>';
          }
        } catch (e) {
          followAnswer.innerHTML = '<div style="color:var(--error,#dc2626);">连接超时或后端不可用。</div>';
        }
        followInput.value = '';
        followBtn.disabled = false;
        followBtn.textContent = '追问';
      };
      followBtn.addEventListener('click', doFollowup);
      followInput.addEventListener('keydown', e => { if (e.key === 'Enter') doFollowup(); });
    }
  }

  $('#aiModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('show');
  });

  // ==================== 辅助函数 ====================
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function brandColor(brand) {
    const map = { '苹果':'#555', '华为':'#c41230', '小米':'#ff6900', 'vivo':'#415fff', 'OPPO':'#1ba784', '荣耀':'#0b8ed0', '三星':'#1428a0', 'NVIDIA':'#76b900', 'AMD':'#ed1c24', 'Intel':'#0071c5', '格力':'#00a0e9', '美的':'#0066cc', '海尔':'#009ad6', '石头':'#333', '追觅':'#e60012', '科沃斯':'#005bac', '云鲸':'#00b4d8', '联想':'#e2231a', '华硕':'#00b3e3', '戴尔':'#007db8', '索尼':'#000', 'Bose':'#111', 'LG':'#a50034', 'AOC':'#e2231a' };
    return map[brand] || '#999';
  }
  // 各品类拼接搜索词用的后缀，提高图片命中精度
  const IMG_KEYWORD = { phone:'手机', gpu:'显卡', ac:'空调', robot:'扫地机器人', laptop:'笔记本电脑', cpu:'处理器', earphone:'耳机', monitor:'显示器' };
  function bingImage(phone) {
    const suffix = IMG_KEYWORD[state.category] || '';
    const q = encodeURIComponent((phone.brand + ' ' + phone.model + ' ' + suffix).trim());
    return 'https://tse1.mm.bing.net/th?q=' + q + '&w=300&h=300&c=7';
  }
  // 三级图片降级：本地图 → 在线图(CDN/必应) → SVG 占位。任何一级加载失败自动降级，绝不空白。
  function phoneImage(phone) {
    const local = 'images/' + phone.id + '.jpg';           // 1) 项目内本地图（离线可看、传GitHub自带）
    const online = (phone.image && phone.image.startsWith('http')) ? phone.image : bingImage(phone); // 2) 在线兜底
    const alt = escapeHtml(phone.model);
    const fb = svgFallback(phone).replace(/"/g, '&quot;');  // 3) 最终 SVG 占位（存到 data 属性备用）
    return `<img src="${local}" alt="${alt}" loading="lazy" data-stage="1" data-online="${escapeHtml(online)}"`
      + ` style="width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff"`
      + ` onerror="var s=this.getAttribute('data-stage');`
      + ` if(s==='1'){this.setAttribute('data-stage','2');this.src=this.getAttribute('data-online');}`
      + ` else{this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='block';}"/>`
      + `<span style="display:none">${svgFallback(phone)}</span>`;
  }
  function svgFallback(phone) {
    const c = brandColor(phone.brand);
    const name = phone.model.length > 8 ? phone.model.slice(0,8) + '…' : phone.model;
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="18" width="70" height="68" rx="10" fill="${c}" opacity="0.12"/><rect x="15" y="18" width="70" height="68" rx="10" fill="none" stroke="${c}" stroke-width="2" opacity="0.4"/><rect x="45" y="8" width="10" height="4" rx="2" fill="${c}" opacity="0.5"/><text x="50" y="46" text-anchor="middle" fill="${c}" font-size="9" font-weight="600" font-family="sans-serif">${phone.brand}</text><text x="50" y="62" text-anchor="middle" fill="${c}" font-size="7" font-family="sans-serif" opacity="0.85">${name}</text></svg>`;
  }

  // ==================== 初始化 ====================
  function init() {
    navigateTo('home');
  }

  document.addEventListener('DOMContentLoaded', init);
  </script>
  </body>
  </html>
